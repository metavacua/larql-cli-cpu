# The shared body of every crate gate. The crate comes from the branch name
# (experiment/crate/<package>); a branch that is not one skips everything.
#
#   fmt (once; a failure ends the run) -> for each target: clippy -> build -> lql
#
# `targets` is a JSON array of {target, runs_on, features, clippy_args, lql}.
name: crate-gate-run

on:
  workflow_call:
    inputs:
      targets: {type: string, required: true}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      crate: ${{ steps.r.outputs.crate }}
      kind: ${{ steps.r.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
      - id: r
        run: |
          branch="${GITHUB_HEAD_REF}"
          crate="${branch#experiment/crate/}"
          if [ "$crate" = "$branch" ]; then
            echo "not a crate branch ($branch): nothing to gate"
            echo "crate=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          meta=$(cargo metadata --no-deps --format-version 1)
          echo "$meta" | jq -e --arg c "$crate" '.packages[] | select(.name == $c)' > /dev/null \
            || { echo "::error::$branch names no workspace package '$crate'"; exit 1; }
          kind=bin
          echo "$meta" | jq -e --arg c "$crate" '.packages[] | select(.name == $c) | .targets[] | select(.kind | index("lib"))' > /dev/null && kind=lib
          echo "crate=$crate" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "gating $crate ($kind)"

  fmt:
    needs: resolve
    if: needs.resolve.outputs.crate != ''
    name: fmt · ${{ needs.resolve.outputs.crate }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt -p ${{ needs.resolve.outputs.crate }} -- --check

  chain:
    name: ${{ matrix.t.target }}
    needs: [resolve, fmt]
    if: needs.resolve.outputs.crate != ''
    strategy:
      fail-fast: false # a red target hides none of the others
      matrix:
        t: ${{ fromJSON(inputs.targets) }}
    uses: ./.github/workflows/crate-gate-chain.yml
    with:
      crate: ${{ needs.resolve.outputs.crate }}
      kind: ${{ needs.resolve.outputs.kind }}
      target: ${{ matrix.t.target }}
      runs_on: ${{ matrix.t.runs_on }}
      features: ${{ matrix.t.features }}
      clippy_args: ${{ matrix.t.clippy_args }}
      lql: ${{ matrix.t.lql }}
    secrets: inherit
