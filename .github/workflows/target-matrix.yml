# Target matrix: binary-crate host-capability ladder + library-crate
# conditional no_std check.
#
# This is deliberately NOT another per-push gate. It complements the
# existing per-crate workflows (larql-cli.yml, larql-compute.yml, ...),
# which already cover x86_64-unknown-linux-gnu / windows-msvc / macOS on
# every push, by asking two questions nothing else in this repo asks:
#
#   1. For the two BINARY crates (larql-cli, larql-router), how far does
#      compilation get as OS services are progressively taken away (down
#      to none at all), and do the other Tier-1 GNU targets (aarch64,
#      x86_64-pc-windows-gnu) - which nothing else here builds - still
#      really pass? One deliberate Tier-1-only exception:
#      riscv64gc-unknown-linux-gnu (Tier 2 WITH host tools) is also a real
#      gate here, not just a diagnostic rung - see binary-gnu-riscv64
#      below for why this one non-Tier-1 target earns the same "must
#      compile and run" bar as the Tier-1 legs. i686-unknown-linux-gnu is
#      dropped for now (2026-09-30): confirmed `libopenblas-dev:i386`
#      does not exist in Ubuntu noble's archives at all, and this crate's
#      OpenBLAS linkage (larql-blas-link) is unconditional system
#      linking with no from-source fallback - a real dependency-graph
#      gap (Cargo.toml, not this CI file) to close before i686 comes back.
#   2. For the LIBRARY crates with no obviously-unconditional OS coupling,
#      how far would a `#![no_std]` port get today, across both a
#      "decomposition" set (wasm32v1-none, the riscv32/64-*-none-elf
#      family, aarch64-unknown-none, x86_64-unknown-none - freestanding
#      core+alloc-only targets) and their "composition" partners (the
#      full-OS GNU targets one architecture over, several of which are
#      already real gates in question 1)? aarch64-unknown-uefi and
#      x86_64-unknown-uefi ride the same mechanism (stable-shipped
#      core+alloc, no host tools) but are included for a different
#      reason - not a new failure class the -none family doesn't already
#      catch, but a genuinely distinct deployment scenario (a
#      bootloader-stage tool reading a vindex manifest before an OS
#      loads).
#
# Considered and deliberately left out: riscv64a23-unknown-linux-gnu. It
# is Tier 2 WITHOUT host tools with no stable prebuilt std today, so using
# it at all needs `-Zbuild-std`, which is nightly-only. Every job in this
# file runs on the same pinned-stable discipline as the rest of this repo
# (rust-toolchain.toml); nothing here ever switches to nightly for one
# target. If riscv64a23 - or any genuinely Tier-3 target - is ever worth
# adding, it belongs in a separate, dedicated nightly-toolchain workflow,
# never mixed into this stable-only file.
#
# Toolchain resolution: every job adds its cross target(s) with a plain
# `rustup target add <target>` step, never `dtolnay/rust-toolchain@stable`
# with a `targets:` input. Confirmed empirically (2026-09-30, across two
# consecutive live dispatches) why that distinction matters here
# specifically: this repo pins an EXACT toolchain via rust-toolchain.toml
# (channel = "1.98.0"), but `dtolnay/rust-toolchain@stable`'s `targets:`
# input runs `rustup toolchain install stable --target ...` against the
# literal "stable" channel name - a DIFFERENT toolchain install than
# whatever rust-toolchain.toml pins the moment "stable" drifts to a newer
# patch (it had: stable was 1.98.1, the pin was 1.98.0). Every actual
# `cargo`/`rustc` invocation inside this checked-out repo then resolves
# the PINNED 1.98.0 toolchain (rustup's directory-override auto-install,
# confirmed live in a run's own log: "the missing active toolchain
# 1.98.0-... has been auto-installed"), which never got the extra cross
# target added at all - a hard `error[E0463]: can't find crate for
# 'core'` masquerading as "target not installed" on the windows-gnu leg,
# and a SILENTLY IDENTICAL-LOOKING false negative on every no_std cell
# (those cells' cargo invocations fail with "can't find crate for `std`"
# either way - whether from this bug or from the crate genuinely not
# being `#![no_std]` yet - so the policy script's exit-code-only check
# could not tell the two apart). A plain `rustup target add <target>`
# run from inside the checked-out directory (after `actions/checkout`)
# instead resolves and auto-installs the PINNED toolchain (picking up
# its declared `components = ["clippy", "rustfmt"]` for free) and adds
# the target to that exact toolchain - there is only ever one toolchain
# on the runner, matching what every later step actually uses.
#
# Scope note: this workflow was designed against this repository's own
# 14-crate closure specifically (larql-cli-cpu, the CPU-only extraction),
# not the larger upstream workspace it was extracted from. Upstream also
# has larql-server, vindex-cli, larql-compute-metal, larql-demos,
# larql-python and model-compute; none of them is a member of this
# workspace, and none is named anywhere below.
#
# House-style note carried through every job: failing steps are never
# redirected to a file or summarised away. `cargo check` / `cargo clippy`
# / `cargo fmt` are invoked with their output going straight to the step
# log, so a red step already shows the full, unfiltered compiler text -
# see the "Print it here, unfiltered." precedent in
# lql-strategy-matrix.yml. Nothing here pipes a command through `tail`,
# `--quiet`, or `2>/dev/null`.

name: target-matrix

on:
  # This workflow answers a question that is a pure function of this
  # repo's own code and Cargo.lock - unlike `quality.yml`'s cargo-audit
  # job, there is no externally-drifting advisory database to catch, so
  # there is no equivalent case for a *weekly* schedule here.
  #
  # It is also expensive in a way none of this repo's push/PR gates are:
  # four native runners (including one Windows and one arm64 leg) plus a
  # 60-cell cross-compilation matrix across toolchains nothing else here
  # installs. So: no `push:`/`pull_request:` trigger here. A separate,
  # narrow, path-filtered workflow scoped to one crate at a time is the
  # right complement for PR-time feedback once a crate's no_std port is
  # actually underway - this file is the full, infrequent audit, not
  # that.
  #
  # `workflow_dispatch` covers the actual expected use: run this before
  # or after a dependency bump, or before committing to a real `no_std`
  # port, to get a fresh read. A light MONTHLY schedule (not weekly, and
  # narrower than quality.yml's cadence, because nothing here goes stale
  # for advisory reasons - only for toolchain/target-support rot) exists
  # purely so the matrix itself doesn't bit-rot from disuse.
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 1 * *' # first of the month, 06:00 UTC

permissions:
  contents: read

# Matches what `dtolnay/rust-toolchain@stable` used to set per-job before
# every job switched to a plain `rustup target add` step (see the file
# header) - disable incremental compilation (CI never reuses a target/
# across runs anyway, see the "No compiled workspace artefacts" step in
# every job below) and force colored compiler output in step logs.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

# Supersede in-flight pull-request runs: pushing a new commit to a PR
# cancels the runs still compiling the previous one. Non-PR runs (main
# pushes, schedules, manual dispatch) are keyed by `run_id`, unique per
# run, so they are each alone in their group - not the same as
# `cancel-in-progress: false`, since a concurrency group still holds at
# most one pending run and would otherwise evict an intermediate main
# commit's record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Binary-crate ladder, leg 1: the three diagnostic wasm rungs plus
  # the native x86_64-unknown-linux-gnu gate. All four targets share this
  # leg's host architecture (x86_64) - a cargo build script or proc-macro
  # ALWAYS compiles for the HOST regardless of the `--target` being
  # checked, so nothing here needs a different runner.
  # i686-unknown-linux-gnu is dropped for now (2026-09-30) - see the file
  # header. aarch64-unknown-linux-gnu and x86_64-pc-windows-gnu need a
  # genuinely different host to even RUN their test binaries (see the
  # jobs below), so they gain nothing from being here either.
  binary-ladder-ubuntu-x86_64:
    name: binary ladder (x86_64 host) · ${{ matrix.crate }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        include:
          # larql-cli's default features are just `research` (no `gpu`
          # exists in this workspace) - bare `cargo check`/`test` already
          # gets the right feature set, no extra flags needed.
          - crate: larql-cli
            extra_flags: ''
          # larql-router defaults to `default = []` - nothing to opt out of.
          - crate: larql-router
            extra_flags: ''

    steps:
      - uses: actions/checkout@v7

      # T2-without-host-tools targets need only `rustup target add` - no
      # SDK - for `cargo check`. wasm32-unknown-emscripten's Emscripten
      # SDK requirement is specifically a LINK-time requirement (`emcc`
      # is required to link the final wasm binary); this job only ever
      # runs `cargo check` on it (see Rung 2 below), which never reaches
      # the linker, so emsdk is deliberately never installed anywhere in
      # this job.
      - name: Add rustup targets (wasm32 diagnostic rungs)
        run: rustup target add wasm32-unknown-unknown wasm32-unknown-emscripten wasm32-wasip1

      # OpenBLAS is a SYSTEM dependency here, not vendored:
      # `larql-compute`'s Linux target-cfg block pulls in the in-repo
      # `larql-blas-link` crate, which links the system `libopenblas`
      # (a plain `-lopenblas`, no pkg-config probe, no download) rather
      # than building one, so every one of this job's binary crates needs
      # it on the linker path to link successfully (larql-cli reaches
      # larql-compute transitively
      # through larql-inference; larql-router has no larql-compute
      # dependency at all - installing it unconditionally is simpler and
      # harmless).
      - name: Install OpenBLAS (native, x86_64)
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config

      - name: Cache cargo registry (downloads only, never target/)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg2-target-matrix-ladder-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg2-target-matrix-ladder-

      - name: No compiled workspace artefacts may be restored
        shell: bash
        run: |
          # The cache above carries downloads only. A target/ restored from
          # another commit can satisfy a link against stale code, so a green
          # matrix would be evidence about an artefact that is not in this
          # commit. Fail loudly rather than build on one.
          if [ -e target ]; then
            echo "::error::target/ was restored from cache - the cache key or path is wrong"
            exit 1
          fi

      # ── Rung 1/4: wasm32-unknown-unknown ("unknown"). No OS at all.
      # `continue-on-error: true` so Rungs 2-4 still run even if this one
      # fails - the point of a ladder is to see how far each crate gets,
      # not to stop at the first broken rung.
      - name: 'Rung 1/4 (unknown): cargo check --target wasm32-unknown-unknown'
        id: rung1
        continue-on-error: true
        run: cargo check --target wasm32-unknown-unknown -p ${{ matrix.crate }} --bins ${{ matrix.extra_flags }}

      # ── Rung 2/4: wasm32-unknown-emscripten. Unlocks a real,
      # POSIX-compatible (musl-based) filesystem and JS interop.
      - name: 'Rung 2/4 (emscripten): cargo check --target wasm32-unknown-emscripten'
        id: rung2
        continue-on-error: true
        run: cargo check --target wasm32-unknown-emscripten -p ${{ matrix.crate }} --bins ${{ matrix.extra_flags }}

      # ── Rung 3/4: wasm32-wasip1. Unlocks a real, WASI-syscall-backed
      # filesystem (a different mechanism than emscripten's POSIX
      # emulation) while explicitly, definitively refusing threads and
      # process spawn (both "always return an error" per the WASI docs,
      # not merely unstubbed).
      - name: 'Rung 3/4 (wasi): cargo check --target wasm32-wasip1'
        id: rung3
        continue-on-error: true
        run: cargo check --target wasm32-wasip1 -p ${{ matrix.crate }} --bins ${{ matrix.extra_flags }}

      # ── Rung 4/4 (gnu), x86_64-unknown-linux-gnu: the one target in
      # this job with a full native OS underneath it. This is the first
      # rung expected to actually pass, so - unlike Rungs 1-3 - it is a
      # REAL gate: no continue-on-error, and a failure here fails the
      # job.
      - name: 'Rung 4/4 (gnu, x86_64-unknown-linux-gnu): cargo check'
        run: cargo check --target x86_64-unknown-linux-gnu -p ${{ matrix.crate }} --bins ${{ matrix.extra_flags }}

      - name: 'Rung 4/4 (gnu, x86_64-unknown-linux-gnu): cargo test'
        run: cargo test --target x86_64-unknown-linux-gnu -p ${{ matrix.crate }} ${{ matrix.extra_flags }}

      - name: Ladder summary
        if: always()
        run: |
          {
            echo "### binary ladder · ${{ matrix.crate }} (x86_64 host)"
            echo "| rung | target | outcome |"
            echo "|---|---|---|"
            echo "| 1 | wasm32-unknown-unknown | ${{ steps.rung1.outcome }} |"
            echo "| 2 | wasm32-unknown-emscripten | ${{ steps.rung2.outcome }} |"
            echo "| 3 | wasm32-wasip1 | ${{ steps.rung3.outcome }} |"
            echo "| 4 (gnu) | x86_64-unknown-linux-gnu | real gate above |"
            echo "| - | i686-unknown-linux-gnu | dropped 2026-09-30, see file header |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Binary-crate ladder, leg 2: the Tier-1 GNU target that needs a
  # genuinely different host. `cargo test` has to RUN the compiled
  # binary, and an x86_64 runner cannot run aarch64 code without
  # emulation; a native arm64 runner sidesteps that entirely (same
  # philosophy release.yml already uses: one native runner per target,
  # never a cross-linker-plus-QEMU setup).
  binary-gnu-aarch64:
    name: binary gnu gate (aarch64) · ${{ matrix.crate }}
    # GitHub-hosted arm64 Ubuntu runners. If this label is unavailable on
    # this repository's plan, the fallback is a self-hosted arm64 runner
    # or QEMU user-mode emulation, neither of which this job attempts.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: larql-cli
            extra_flags: ''
          - crate: larql-router
            extra_flags: ''

    steps:
      - uses: actions/checkout@v7

      # aarch64-unknown-linux-gnu is this runner's own native host
      # target, so it is already present the moment the pinned toolchain
      # auto-installs - this step exists for self-documentation and
      # uniformity with the other jobs, not because it does real work.
      - name: Add rustup target (aarch64-unknown-linux-gnu)
        run: rustup target add aarch64-unknown-linux-gnu

      # A native arm64 machine, so this is the plain apt package - no
      # multiarch/multilib dance like the (now-dropped) i686 leg needed.
      - name: Install OpenBLAS (Linux, aarch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config

      - name: Cache cargo registry (downloads only, never target/)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-arm64-cargo-reg2-target-matrix-aarch64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm64-cargo-reg2-target-matrix-aarch64-

      - name: No compiled workspace artefacts may be restored
        shell: bash
        run: |
          if [ -e target ]; then
            echo "::error::target/ was restored from cache - the cache key or path is wrong"
            exit 1
          fi

      # A REAL gate, same as x86_64-unknown-linux-gnu above: a Tier-1
      # GNU target with a full native OS, running on the architecture it
      # targets, so nothing here should be structurally unable to pass.
      - name: 'Rung 4/4 (gnu, aarch64-unknown-linux-gnu): cargo check'
        run: cargo check --target aarch64-unknown-linux-gnu -p ${{ matrix.crate }} --bins ${{ matrix.extra_flags }}

      - name: 'Rung 4/4 (gnu, aarch64-unknown-linux-gnu): cargo test'
        run: cargo test --target aarch64-unknown-linux-gnu -p ${{ matrix.crate }} ${{ matrix.extra_flags }}

  # ── Binary-crate ladder, leg 3: the other Tier-1 GNU target needing a
  # genuinely different host - a windows-gnu binary needs a real Windows
  # OS to run, same reasoning as the aarch64 leg above.
  binary-gnu-windows-gnu:
    name: binary gnu gate (windows-gnu) · ${{ matrix.crate }}
    runs-on: windows-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: larql-cli
            extra_flags: ''
          - crate: larql-router
            extra_flags: ''

    steps:
      - uses: actions/checkout@v7

      # x86_64-pc-windows-gnu is a cross target on this runner (its
      # native host is x86_64-pc-windows-msvc), so it genuinely needs
      # adding. This is exactly the job that first surfaced the
      # toolchain-pin bug documented in the file header (confirmed
      # 2026-09-30: `error[E0463]: can't find crate for 'core'`, "the
      # x86_64-pc-windows-gnu target may not be installed" - the target
      # had only ever been added to the "stable" channel, never to the
      # rust-toolchain.toml-pinned 1.98.0 every actual cargo invocation
      # here resolves) - plain `rustup target add` fixes it.
      - name: Add rustup target (x86_64-pc-windows-gnu)
        run: rustup target add x86_64-pc-windows-gnu

      # `windows-latest` defaults to the MSVC toolchain; rustc's gnu
      # targets still shell out to a real `gcc`/`ld` to link, which MSVC
      # does not provide. Chocolatey's `mingw` package is the same
      # install mechanism this repo already uses for `protoc` below.
      - name: Install MinGW-w64 toolchain (Windows)
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          # Chocolatey's `mingw` package has installed to one of these
          # paths across different runner-image generations; check all of
          # them rather than hardcoding one, and fail loudly (AGENTS.md: no
          # silent fallback) if none exists, rather than silently leaving
          # rustc's windows-gnu linker unable to find `gcc`/`ld`.
          # `C:\ProgramData\mingw64\mingw64\bin` is the one actually
          # confirmed live on the runner image in use as of 2026-09-30
          # (chocolatey's own install log printed
          # "Testing path: C:\ProgramData\mingw64\mingw64\bin...Found!") -
          # neither of the other two candidates existed on that run; they
          # are kept as candidates in case a future image reverts to one
          # of them, not removed just because they didn't match this time.
          $candidates = @(
            'C:\ProgramData\mingw64\mingw64\bin',
            'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin',
            'C:\tools\mingw64\bin'
          )
          $mingwBin = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mingwBin) {
            Write-Error "mingw64\bin not found under any known chocolatey install path ($($candidates -join ', ')) - inspect this step's log and update the candidate list"
            exit 1
          }
          $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install OpenBLAS (Windows)
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$vcpkgRoot\vcpkg.exe" install openblas:x64-windows

      # larql-router-protocol's build.rs relies on a SYSTEM protoc on
      # Windows (its non-Windows path bundles one via protobuf_src, whose
      # cmake-driven build fails specifically on windows-latest - see
      # that crate's build.rs and larql-cli.yml, which installs protoc
      # the same way for the same reason). Both binary crates in this
      # job reach larql-router-protocol - larql-cli transitively through
      # larql-inference, larql-router directly.
      - name: Install protoc (Windows)
        shell: pwsh
        run: choco install protoc -y --no-progress

      - name: Cache cargo registry (downloads only, never target/)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg2-target-matrix-windows-gnu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg2-target-matrix-windows-gnu-

      - name: No compiled workspace artefacts may be restored
        shell: bash
        run: |
          if [ -e target ]; then
            echo "::error::target/ was restored from cache - the cache key or path is wrong"
            exit 1
          fi

      - name: 'Rung 4/4 (gnu, x86_64-pc-windows-gnu): cargo check'
        run: cargo check --target x86_64-pc-windows-gnu -p ${{ matrix.crate }} --bins ${{ matrix.extra_flags }}

      - name: 'Rung 4/4 (gnu, x86_64-pc-windows-gnu): cargo test'
        run: cargo test --target x86_64-pc-windows-gnu -p ${{ matrix.crate }} ${{ matrix.extra_flags }}

  # ── Binary-crate ladder, leg 4: riscv64gc-unknown-linux-gnu. Not a
  # Tier-1 target (Tier 2 WITH host tools), but explicitly promoted to the
  # same "must compile AND run" bar as the Tier-1 legs above: the
  # riscv32/64-*-none-elf family in library-no-std-check decomposes the
  # RV64GC profile into its extension subsets (I/M/A/F/D/C, the "G"
  # umbrella), and riscv64gc-unknown-linux-gnu is exactly their full-OS
  # composition - the one target that recombines that whole extension set
  # under a real kernel+libc. No native riscv64 GitHub-hosted runner
  # exists, so this leg cross-compiles from an x86_64 host and RUNS the
  # resulting binary under QEMU user-mode emulation (qemu-riscv64-static)
  # rather than stopping at `cargo check` the way that would leave "must
  # run" unchecked.
  binary-gnu-riscv64:
    name: binary gnu gate (riscv64gc, cross+qemu) · ${{ matrix.crate }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: larql-cli
            extra_flags: ''
          - crate: larql-router
            extra_flags: ''

    steps:
      - uses: actions/checkout@v7

      # riscv64gc-unknown-linux-gnu is a cross target from this runner's
      # native x86_64-unknown-linux-gnu host. Plain `rustup target add`,
      # not `dtolnay/rust-toolchain@stable` - see the file header: the
      # same toolchain-pin mismatch confirmed broken on the windows-gnu
      # leg applies identically here.
      - name: Add rustup target (riscv64gc-unknown-linux-gnu)
        run: rustup target add riscv64gc-unknown-linux-gnu

      # gcc-riscv64-linux-gnu/libc6-dev-riscv64-cross: the cross-compiler
      # and target sysroot rustc's riscv64gc-unknown-linux-gnu linker
      # needs. qemu-user-static - NOT the docs page's stated
      # qemu-system-riscv64, which is a full-system emulator and does not
      # provide qemu-riscv64-static at all (confirmed directly against the
      # actual .deb file listing, not just the docs prose) - is what
      # actually ships /usr/bin/qemu-riscv64-static, the user-mode
      # emulator that runs a riscv64 ELF binary directly on this x86_64
      # runner.
      - name: Install riscv64 cross-toolchain + QEMU user-mode emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-riscv64-linux-gnu g++-riscv64-linux-gnu libc6-dev-riscv64-cross \
            qemu-user-static

      # Confirmed empirically (2026-09-30 CI run, after every earlier
      # riscv64gc blocker was fixed): `larql-continuation-fixture` - a
      # dylib test fixture some larql-cli test dynamically loads - is
      # compiled for the HOST (x86_64-unknown-linux-gnu sysroot, plain
      # `cc`, `-m64`) even inside an otherwise riscv64-targeted cargo
      # invocation, because it must run natively to be loadable. It still
      # depends on larql-compute, so it still needs a native x86_64
      # OpenBLAS - the riscv64-arch package installed below does not
      # cover it. Every other job in this file installs this; this job
      # is the one place cross-compiling for a non-native target made it
      # easy to forget the native side still needs it too.
      - name: Install OpenBLAS (native, x86_64 - for host-built plugin fixtures)
        run: |
          sudo apt-get install -y libopenblas-dev pkg-config

      # riscv64 is an Ubuntu "ports" architecture (unlike i386, which sat
      # on the main archive), so its packages live under ports.ubuntu.com,
      # not the default mirrors - `dpkg --add-architecture` alone is not
      # enough here.
      #
      # Confirmed empirically (2026-09-30 CI run): a plain `apt-get
      # update` after adding riscv64 as a foreign architecture does NOT
      # just pick up the new ports-riscv64.list source - it also tries
      # every OTHER already-configured source (azure.archive.ubuntu.com,
      # security.ubuntu.com, the runner's default main-archive mirrors)
      # for a riscv64 index too, since none of those source entries
      # restrict `Architectures:` to amd64. Those mirrors do not host
      # riscv64 at all, so that update fails outright with a 404 on every
      # one of them before ever reaching the ports.ubuntu.com fetch that
      # would actually succeed. The fix is to scope the update to just
      # the newly-added list file, leaving every other source's
      # already-cached (amd64) indices untouched.
      #
      # Confirmed empirically (second 2026-09-30 CI run, after the fix
      # above landed): the scoped update itself then succeeds, but
      # `libopenblas-dev:riscv64`'s real implementation packages
      # (libopenblas-pthread-dev/-openmp-dev/-serial-dev, its Depends
      # alternatives) came back "not installable" even though they do
      # exist for riscv64 on Ubuntu noble (verified directly against
      # packages.ubuntu.com/noble/riscv64/libopenblas-pthread-dev). The
      # bug was narrower than "riscv64 lacks this package": the source
      # line only added the bare `noble` suite/pocket, missing
      # `noble-updates` and `noble-security` - the same pocket set every
      # other source on this runner already carries for amd64.
      - name: Install OpenBLAS for riscv64 (ports archive)
        run: |
          sudo dpkg --add-architecture riscv64
          CODENAME=$(lsb_release -cs)
          {
            echo "deb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports $CODENAME main universe"
            echo "deb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports $CODENAME-updates main universe"
            echo "deb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports $CODENAME-security main universe"
          } | sudo tee /etc/apt/sources.list.d/ports-riscv64.list
          sudo apt-get update \
            -o Dir::Etc::sourcelist="sources.list.d/ports-riscv64.list" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y libopenblas-dev:riscv64 pkg-config
          # larql-blas-link does no pkg-config probe: tell its build script
          # where the riscv64 libopenblas lives. The variable is target-scoped
          # so the host-built continuation fixture is not handed a riscv64
          # directory on its x86_64 link line.
          echo "OPENBLAS_LIB_DIR_riscv64gc_unknown_linux_gnu=/usr/lib/riscv64-linux-gnu" >> "$GITHUB_ENV"

      # A real linker (the cross-gcc above) for building, and a runner
      # that hands the resulting binary to qemu-riscv64-static with the
      # cross sysroot so dynamic linking resolves against riscv64
      # libraries at test-run time, not this runner's native x86_64 ones.
      - name: Configure cross linker + QEMU runner for riscv64gc-unknown-linux-gnu
        run: |
          {
            echo "CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc"
            echo "CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER=qemu-riscv64-static -L /usr/riscv64-linux-gnu"
            # The runner's -L reaches only the test process. A test that
            # spawns the riscv64 binary (test_continuation_plugin_cli) starts
            # it through binfmt_misc, which has no sysroot, so its dynamic
            # loader cannot find libstdc++.so.6. QEMU_LD_PREFIX is honoured
            # by every qemu-user instance, children included. Probe run
            # 36807867138: red without it, green with it.
            echo "QEMU_LD_PREFIX=/usr/riscv64-linux-gnu"
          } >> "$GITHUB_ENV"

      - name: Cache cargo registry (downloads only, never target/)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg2-target-matrix-riscv64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg2-target-matrix-riscv64-

      - name: No compiled workspace artefacts may be restored
        shell: bash
        run: |
          if [ -e target ]; then
            echo "::error::target/ was restored from cache - the cache key or path is wrong"
            exit 1
          fi

      # A REAL gate: "larql-cli must compile and run on
      # riscv64gc-unknown-linux-gnu" is a hard requirement, not a
      # diagnostic rung - unlike the wasm rungs in leg 1, there is no
      # continue-on-error here.
      - name: 'riscv64gc-unknown-linux-gnu: cargo check'
        run: cargo check --target riscv64gc-unknown-linux-gnu -p ${{ matrix.crate }} --bins ${{ matrix.extra_flags }}

      - name: 'riscv64gc-unknown-linux-gnu: cargo test (under QEMU user-mode emulation)'
        run: cargo test --target riscv64gc-unknown-linux-gnu -p ${{ matrix.crate }} ${{ matrix.extra_flags }}

  # ── Library-crate conditional no_std check. ──
  #
  # Each cell's expected outcome is declared in that crate's own
  # crates/<crate>/no-std-policy.json (scripts/check_no_std_policy.py),
  # mirroring how crates/<crate>/coverage-policy.json already tracks a
  # different per-crate debt baseline in this repo: a checked-in,
  # versioned statement of what is CURRENTLY expected, read by a script,
  # ratcheted tighter one target at a time, never loosened silently.
  #
  # Today every cell for every crate below is declared "expected-fail":
  # none of these five crates declares `#![no_std]` yet (confirmed by
  # grep, not assumed), so every check fails at the crate root
  # (`error[E0463]: can't find crate for 'std'`) regardless of how clean
  # its dependency graph looks. That is the honest starting state of a
  # port nobody has begun, not a defect in this workflow - and it is why
  # these steps are no longer a blanket `continue-on-error: true`: the
  # policy script turns "did it pass" into "did it match what we already
  # know to expect", so a REAL regression (a target that was already
  # ported starts failing again) still fails the job, while the
  # universal not-yet-ported baseline does not.
  library-no-std-check:
    name: no_std check · ${{ matrix.crate }} · ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Every crate marked not-plausible-without-refactor in the
        # leaf-first repo analysis is named here explicitly, so it is
        # clear each was considered and skipped for a stated reason, not
        # forgotten:
        #
        #   larql-compute         - rayon + a per-target BLAS backend
        #                            (blas-src / larql-blas-link) are
        #                            unconditional, core to the crate's
        #                            purpose, and behind no feature.
        #   larql-factory         - reqwest is unconditional with no
        #                           feature to gate it, and it also
        #                           depends unconditionally on
        #                           larql-models' ungated memmap2.
        #   larql-inference       - tokio, wasmtime, reqwest,
        #                           tonic/prost, memmap2, rayon and a
        #                           BLAS backend are all unconditional
        #                           default dependencies.
        #   larql-kv              - depends unconditionally on
        #                           larql-inference and larql-vindex,
        #                           both themselves not-plausible.
        #   larql-lql             - reqwest (USE REMOTE) and rustyline
        #                           (REPL) are unconditional, plus
        #                           unconditional larql-inference and
        #                           larql-vindex.
        #   larql-router-protocol - tonic and tokio (net) are
        #                           unconditional and woven through the
        #                           generated code; quic/http3 only add
        #                           more, never gate them.
        #   larql-vindex          - reqwest, hf-hub, memmap2 and rayon
        #                           are unconditional, central to
        #                           vindex loading/HF-hub publish.
        crate:
          - larql-boundary
          - larql-execution
          - larql-vindex-spec
          - larql-models
          - larql-core
        # Two families here, on purpose:
        #
        #   Decomposition (12 targets): wasm32v1-none, every
        #   riscv32/64-*-none-elf target Tier 2 covers, plus
        #   aarch64-unknown-none and x86_64-unknown-none. Each is a
        #   freestanding, core+alloc-only target with no OS underneath -
        #   see the accompanying write-up for why pairing a
        #   frozen-feature-set wasm target with a real hardware ISA's
        #   mixed atomics story (riscv32i has none; riscv32imac/imafc do;
        #   aarch64 always does - AArch64 mandates atomics in its base
        #   ISA, unlike RISC-V's optional "A" extension) catches more than
        #   either family alone. aarch64-unknown-none/x86_64-unknown-none
        #   complete this decomposition for the two architectures whose
        #   full-OS composition (aarch64-unknown-linux-gnu,
        #   x86_64-unknown-linux-gnu) is already a real gate above, the
        #   same pairing riscv64gc-unknown-linux-gnu completes for RV64GC.
        #
        #   UEFI (2 targets): aarch64-unknown-uefi, x86_64-unknown-uefi.
        #   Mechanically identical to the decomposition set for what this
        #   job actually runs - `cargo check --lib` only needs core+alloc,
        #   and rustup's stable-shipped UEFI artifacts are no_std-only
        #   today regardless of std's "work in progress" status (real std
        #   support needs nightly + `-Zbuild-std`, which this job never
        #   uses - see the file header). Included for a different reason
        #   than the decomposition set: not a new failure class, but a
        #   genuinely distinct real-world scenario (a bootloader-stage
        #   tool reading a vindex manifest before an OS loads).
        target:
          - wasm32v1-none
          - riscv32i-unknown-none-elf
          - riscv32im-unknown-none-elf
          - riscv32imac-unknown-none-elf
          - riscv32imafc-unknown-none-elf
          - riscv32imc-unknown-none-elf
          - riscv64gc-unknown-none-elf
          - riscv64imac-unknown-none-elf
          - aarch64-unknown-none
          - x86_64-unknown-none
          - aarch64-unknown-uefi
          - x86_64-unknown-uefi

    steps:
      - uses: actions/checkout@v7

      # All twelve targets are Tier 2 (without host tools) and ship
      # prebuilt core+alloc rlibs through plain `rustup target add` on
      # the pinned stable toolchain - none of them need `-Zbuild-std` or
      # a nightly switch. That is specifically what distinguishes
      # wasm32v1-none from hand-rolling the same frozen feature set on
      # wasm32-unknown-unknown (see the write-up), and it is also why
      # aarch64-unknown-uefi/x86_64-unknown-uefi fit here despite std
      # itself being unavailable on stable for them - core+alloc, the
      # only thing `cargo check --lib` needs, is. No `components:
      # clippy` input needed here - rust-toolchain.toml already declares
      # `components = ["clippy", "rustfmt"]`, so the pinned toolchain's
      # auto-install (triggered by this very command - see the file
      # header for why a plain `rustup target add` replaced
      # `dtolnay/rust-toolchain@stable` in every job) brings clippy along
      # for free.
      - name: Add rustup target (${{ matrix.target }})
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo registry (downloads only, never target/)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg2-target-matrix-nostd-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg2-target-matrix-nostd-

      - name: No compiled workspace artefacts may be restored
        shell: bash
        run: |
          if [ -e target ]; then
            echo "::error::target/ was restored from cache - the cache key or path is wrong"
            exit 1
          fi

      # `--lib` only: dev-dependencies (criterion, tempfile, ...) are
      # std-only and irrelevant to whether the LIBRARY target itself is
      # no_std-clean, so `--tests`/`--benches`/`--examples` would only
      # add noise here, not signal.
      #
      # larql-core is the one crate whose no-std-policy.json flags it as
      # already having somewhere to go with --no-default-features
      # (drops reqwest AND msgpack). Every other crate here has nothing
      # behind its default feature set worth shedding YET - larql-models
      # is deliberately run plain despite memmap2 being its known
      # blocker: the feature that would let this flag mean anything for
      # larql-models does not exist in its Cargo.toml yet (see its
      # no-std-policy.json), and inventing one here, unasked, is not
      # this workflow's job.
      #
      # The exit code is captured, not allowed to fail the step directly
      # - scripts/check_no_std_policy.py decides the step's real outcome
      # against that crate's policy file.
      - name: cargo check --lib (no_std diagnostic)
        run: |
          set +e
          EXTRA=""
          case "${{ matrix.crate }}" in larql-core|larql-vindex-spec) EXTRA="--no-default-features" ;; esac
          cargo check --target ${{ matrix.target }} -p ${{ matrix.crate }} --lib $EXTRA
          ec=$?
          set -e
          python3 scripts/check_no_std_policy.py \
            "${{ matrix.crate }}" "${{ matrix.target }}" "$ec" "check" \
            "crates/${{ matrix.crate }}/no-std-policy.json"

      # The three core/alloc/std restriction lints, applied via --fix
      # rather than a bare check. Confirmed against clippy's own source
      # (clippy_lints/src/std_instead_of_core.rs) that all three share
      # one emission path using Applicability::MachineApplicable, so
      # --fix genuinely rewrites these - it is not a no-op. This step is
      # a GATE, not a mutation: --fix runs, then the tree must come back
      # clean. A resulting diff means a fixable violation exists and was
      # not applied ahead of time; it is printed unfiltered below as
      # exactly the fix a human should commit. Nothing here pushes or
      # commits from CI - the runner is disposable either way.
      #
      # Dormant today for the same reason the check step above is: no
      # crate here is `#![no_std]` yet, so clippy never gets past the
      # crate root far enough to run its lint passes at all. It activates
      # automatically, per (crate, target) cell, the moment that cell's
      # check step starts passing - no one has to remember to add this
      # later. Fed through the same policy file and script as the check
      # step: a crate is expected to pass BOTH once its port lands, not
      # tracked as two independently-promotable axes.
      #
      # alloc_instead_of_core's own "Known problems" note: it is "only
      # partially aware of the required MSRV for items that were
      # originally in std but moved to core" - unlikely to bite at this
      # repo's pinned 1.98, worth knowing if a fix ever looks wrong.
      - name: 'cargo clippy --fix: core/alloc/std restriction lints (target-scoped)'
        run: |
          set +e
          EXTRA=""
          case "${{ matrix.crate }}" in larql-core|larql-vindex-spec) EXTRA="--no-default-features" ;; esac
          cargo clippy --fix --allow-dirty --allow-staged \
            --target ${{ matrix.target }} -p ${{ matrix.crate }} --lib --no-deps $EXTRA -- \
            -W clippy::std_instead_of_core \
            -W clippy::std_instead_of_alloc \
            -W clippy::alloc_instead_of_core
          clippy_ec=$?
          git diff -- "crates/${{ matrix.crate }}"
          git diff --exit-code -- "crates/${{ matrix.crate }}" > /dev/null
          diff_ec=$?
          set -e
          if [ "$clippy_ec" -ne 0 ]; then ec=$clippy_ec; else ec=$diff_ec; fi
          python3 scripts/check_no_std_policy.py \
            "${{ matrix.crate }}" "${{ matrix.target }}" "$ec" "clippy-fix" \
            "crates/${{ matrix.crate }}/no-std-policy.json"

      - name: Cell summary
        if: always()
        run: |
          {
            echo "| crate | target |"
            echo "|---|---|"
            echo "| ${{ matrix.crate }} | ${{ matrix.target }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── larql-core algo/core isolation probe. ──
  #
  # A different question than library-no-std-check's larql-core row asks.
  # That row checks the WHOLE crate (`cargo check --lib`, no feature
  # flags) against every no_std target - today that's expected-fail
  # purely because the crate root has no `#![no_std]` opt-out yet, and
  # says nothing about WHICH part of the crate would be the blocker once
  # it lands.
  #
  # larql-core has two modules with real OS/network coupling (`io`:
  # std::fs-based checkpoint/csv/json/msgpack/packed load-save; `engine`:
  # reqwest behind the `http` feature) sitting beside two that have none
  # (`algo`: BFS/PageRank/shortest-path/merge/diff/walk; `core`: the
  # Graph/Edge/Node types algo operates on - confirmed by grep, not
  # assumed, to have zero std::fs/std::path/std::env/std::net references
  # anywhere in either). `io`/`engine` are now feature-gated
  # (crates/larql-core/Cargo.toml, default-on so no existing consumer's
  # behavior changes) specifically so `--no-default-features` isolates
  # `algo`+`core` alone as the entire compiled surface - as close as
  # Cargo's crate-level compilation model gets to "check just this
  # module."
  #
  # wasm32v1-none, not any of the riscv-none family, is the right
  # instrument for this specific question: it is the one target in this
  # file where `std` does not exist to link against at all (not merely
  # stubbed-to-panic, the way wasm32-unknown-unknown's std facade is), so
  # a pass here is a compile-time-enforced proof of zero hidden host
  # dependency, not a runtime-untested hope. The riscv32imc/riscv32imac
  # pair in library-no-std-check's matrix is the complementary probe for
  # the OTHER axis (hidden atomics dependency) - this job and that pair
  # together are what "isolate the specific feature sets within a
  # monolithic library" actually means in practice, not just in theory.
  larql-core-algo-isolation:
    name: larql-core algo/core isolation · wasm32v1-none
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Add rustup target (wasm32v1-none)
        run: rustup target add wasm32v1-none

      - name: Cache cargo registry (downloads only, never target/)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg2-target-matrix-algo-isolation-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg2-target-matrix-algo-isolation-

      - name: No compiled workspace artefacts may be restored
        shell: bash
        run: |
          if [ -e target ]; then
            echo "::error::target/ was restored from cache - the cache key or path is wrong"
            exit 1
          fi

      # `--no-default-features` turns off `http`, `msgpack`, `io` and
      # `engine` together - `algo`+`core` (and their unconditional
      # serde/serde_json/thiserror dependencies) are everything left.
      # Exit code captured, not allowed to fail the step directly -
      # scripts/check_no_std_policy.py decides the real outcome against
      # this probe's own policy file, distinct from library-no-std-check's.
      - name: cargo check --lib --no-default-features (algo/core isolation)
        run: |
          set +e
          cargo check --target wasm32v1-none -p larql-core --lib --no-default-features
          ec=$?
          set -e
          python3 scripts/check_no_std_policy.py \
            "larql-core" "wasm32v1-none" "$ec" "check-algo-isolation" \
            "crates/larql-core/no-std-algo-policy.json"

  # ── Target-less hygiene: fmt has no --target concept at all. Confirmed
  # directly (`rustfmt --help`): its flags are --check/--edition/--emit,
  # nothing target-triple-shaped, because rustfmt formats the raw
  # token stream/AST as parsed and never resolves `cfg` - every
  # `#[cfg(target_arch = "wasm32")]`-gated branch gets formatted
  # identically no matter which target would activate it. That is the
  # mirror image of why clippy above has to run once per target: clippy
  # only lints the cfg-resolved code a real compilation would produce,
  # fmt never resolves cfg at all, so there is exactly one fmt check to
  # run, not one per target.
  #
  # The workspace-wide clippy-fix pass below is deliberately NOT scoped
  # to the five no_std-plausible crates: std-vs-core/alloc precision is
  # worth having in every crate, whether or not it will ever target a
  # freestanding platform, and unlike the per-target pass above, this
  # one runs on the host target where every crate already compiles
  # today - the only piece of this whole file that does real, immediate
  # work on first run rather than staying dormant.
  core-alloc-std-hygiene-native:
    name: workspace hygiene (fmt + core/alloc/std, native)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # No extra target needed - this job only ever runs on the native
      # host. This step exists purely to force+confirm the pinned
      # toolchain's auto-install (with its declared clippy+rustfmt
      # components) happens here, predictably, rather than as a side
      # effect buried inside the first real cargo command below.
      - name: Resolve pinned toolchain (rust-toolchain.toml)
        run: rustc --version --verbose

      - name: Install OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev pkg-config

      - name: Cache cargo registry (downloads only, never target/)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg2-target-matrix-hygiene-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg2-target-matrix-hygiene-

      - name: No compiled workspace artefacts may be restored
        shell: bash
        run: |
          if [ -e target ]; then
            echo "::error::target/ was restored from cache - the cache key or path is wrong"
            exit 1
          fi

      # A REAL gate, not continue-on-error: every other workflow in this
      # repo already blocks on `cargo fmt --all -- --check`, and this
      # file should not be the one place that quietly lets it drift.
      # Present here mainly for self-containment - someone running only
      # this workflow via workflow_dispatch still gets the full picture
      # without cross-referencing larql-cli.yml/quality.yml.
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      # continue-on-error, matching the per-target step's reasoning: this
      # is this lint trio's first-ever execution against this codebase,
      # workspace-wide, with no measured baseline yet. Unlike the
      # per-target job, there is no per-crate no-std-policy.json to
      # consult here - this pass is about workspace-wide std/alloc/core
      # precision, not about no_std readiness, so a plain
      # continue-on-error (rather than a policy file) is the right,
      # simpler shape for its first landing. If this ever needs
      # per-crate tracking of its own, that is the point to add one.
      - name: 'cargo clippy --fix: core/alloc/std restriction lints (workspace, native)'
        id: clippy_fix_native
        continue-on-error: true
        run: |
          cargo clippy --fix --allow-dirty --allow-staged --workspace --no-deps -- \
            -W clippy::std_instead_of_core \
            -W clippy::std_instead_of_alloc \
            -W clippy::alloc_instead_of_core
          git diff
          git diff --exit-code

      - name: Hygiene summary
        if: always()
        run: |
          {
            echo "### workspace hygiene (native)"
            echo "| check | outcome |"
            echo "|---|---|"
            echo "| fmt --check | real gate above |"
            echo "| core/alloc/std fix (workspace) | ${{ steps.clippy_fix_native.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
