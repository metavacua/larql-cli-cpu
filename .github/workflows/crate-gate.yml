# Crate gate: one run per crate in larql-cli's dependency graph.
#
# The crate comes from the branch name (experiment/crate/<package>); any other branch skips
# everything. Crate PRs are based on experiment/crate-gate, not main: GitHub filters
# pull_request on the base branch and has no head-branch filter, so that is what keeps fifteen
# crate PRs from waking every shared workflow fifteen times
# (scripts/test_workflow_triggers.py asserts it).
#
#   fmt                      once per crate; a failure ends the run
#   per target, in parallel  build job: clippy step, then build step; then lql-strategy-matrix (strict)
#   cross-target             structural agreement of the lql instances (read-only; no write token)
#
# clippy is per target because its lints depend on the cfg set the target selects; fmt is not.
# A failure at any stage ends that target only. The freestanding Tier 2 without-host-tools
# targets (freestanding: true) drop default features and add the core/alloc/std lints; the gnu
# targets use default features. lql runs where the CLI can run: natively on x86_64 and aarch64 Linux, and under
# QEMU user-mode on riscv64gc-unknown-linux-gnu; the freestanding targets have no OS. The
# 32-bit riscv ladder i -> im -> imac -> imafc (+M, +A+C, +F) is an elimination: imac is the
# control that isolates floating point from imafc. imc, riscv64imac and windows-gnu are
# trimmed. For now only SmolLM2-135M (base and instruct) must pass; the heavier models are off.
# Order and sharing rules: scripts/test_crate_gate_chain.py.
name: crate-gate

on:
  pull_request:
    branches: [main, experiment/crate-gate]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which workflows a crate branch wakes, every workflow's permissions and concurrency, and
  # the order of this gate are themselves under test, so an edit cannot silently start another
  # round of cancelled and queued runs, widen a token or reorder the stages.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install --quiet pyyaml
      - run: python3 scripts/test_workflow_triggers.py
      - run: python3 scripts/test_workflow_hygiene.py
      - run: python3 scripts/test_crate_gate_chain.py

  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      crate: ${{ steps.r.outputs.crate }}
      kind: ${{ steps.r.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
      - id: r
        run: |
          branch="${GITHUB_HEAD_REF}"
          crate="${branch#experiment/crate/}"
          if [ "$crate" = "$branch" ]; then
            echo "not a crate branch ($branch): nothing to gate"
            echo "crate=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          meta=$(cargo metadata --no-deps --format-version 1)
          kind=$(echo "$meta" | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | if any(.targets[]; .kind | index("lib")) then "lib" else "bin" end')
          [ -n "$kind" ] || { echo "::error::$branch names no workspace package '$crate'"; exit 1; }
          echo "crate=$crate" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "gating $crate ($kind)"

  fmt:
    needs: resolve
    if: needs.resolve.outputs.crate != ''
    name: fmt · ${{ needs.resolve.outputs.crate }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt -p ${{ needs.resolve.outputs.crate }} -- --check

  chain:
    name: ${{ matrix.t.target }}
    needs: [resolve, fmt]
    if: needs.resolve.outputs.crate != ''
    strategy:
      fail-fast: false # a red target hides none of the others
      matrix:
        t:
          - { target: wasm32v1-none, freestanding: true }
          - { target: riscv32i-unknown-none-elf, freestanding: true }
          - { target: riscv32im-unknown-none-elf, freestanding: true }
          - { target: riscv32imac-unknown-none-elf, freestanding: true }
          - { target: riscv32imafc-unknown-none-elf, freestanding: true }
          - { target: riscv64gc-unknown-none-elf, freestanding: true }
          - { target: aarch64-unknown-none, freestanding: true }
          - { target: x86_64-unknown-none, freestanding: true }
          - { target: aarch64-unknown-uefi, freestanding: true }
          - { target: x86_64-unknown-uefi, freestanding: true }
          - { target: x86_64-unknown-linux-gnu, runs_on: ubuntu-latest, lql: true }
          - { target: aarch64-unknown-linux-gnu, runs_on: ubuntu-24.04-arm, lql: true }
          - { target: riscv64gc-unknown-linux-gnu, runs_on: ubuntu-latest, lql: true, setup: scripts/ci/riscv64gc_qemu.sh, emulator: "qemu-riscv64-static -cpu rv64 -L /usr/riscv64-linux-gnu" }
    uses: ./.github/workflows/crate-gate-chain.yml
    with:
      crate: ${{ needs.resolve.outputs.crate }}
      kind: ${{ needs.resolve.outputs.kind }}
      target: ${{ matrix.t.target }}
      runs_on: ${{ matrix.t.runs_on || 'ubuntu-latest' }}
      freestanding: ${{ matrix.t.freestanding || false }}
      lql: ${{ matrix.t.lql || false }}
      setup: ${{ matrix.t.setup || '' }}
      emulator: ${{ matrix.t.emulator || '' }}
    secrets: inherit

  # Structural agreement of the lql instances (x86_64, aarch64, riscv64 under QEMU); it judges
  # no model answer. Read-only: artifacts use the runtime token and the summary is a file, so
  # no write token. !cancelled() so a red target hides nothing; the chain-not-skipped clause
  # keeps a failed fmt (chain skipped, no artifacts) from reporting every target missing.
  # Authoritative docs: scripts/lql_matrix/cross_target.py.
  cross-target:
    name: cross-target
    needs: [resolve, chain]
    if: ${{ !cancelled() && needs.resolve.outputs.crate != '' && needs.chain.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: 'results-*'
          path: artifacts
      - name: Compare targets
        run: |
          status=0
          python3 scripts/lql_matrix/cross_target.py "artifacts/results-*/results-*.jsonl" \
            --slow-tag riscv64gc-unknown-linux-gnu \
            --expect-tag x86_64-unknown-linux-gnu \
            --expect-tag aarch64-unknown-linux-gnu \
            --expect-tag riscv64gc-unknown-linux-gnu \
            --strict --out-md cross-target.md --out-json cross-target.json || status=$?
          cat cross-target.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $status
