# Crate gate, wrapper: the 12 freestanding Tier 2 without-host-tools targets (core+alloc; no OS, so no lql).
# Takes its crate from the branch name (experiment/crate/<package>); see crate-gate-run.yml
# for the stages and crate-gate-chain.yml for the per-target order. Crate PRs are based on
# experiment/crate-gate, not main: GitHub filters pull_request on the base branch and has no
# head-branch filter, so this is what keeps fifteen crate PRs from waking every shared
# workflow fifteen times (scripts/test_workflow_triggers.py asserts it).
name: crate-gate

on:
  pull_request:
    branches: [main, experiment/crate-gate]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # Which workflows a crate branch wakes, every workflow's permissions and concurrency, and
  # the order of the gate are themselves under test, so an edit cannot silently start another
  # round of cancelled and queued runs, widen a token or reorder the stages.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install --quiet pyyaml
      - run: python3 scripts/test_workflow_triggers.py
      - run: python3 scripts/test_workflow_hygiene.py
      - run: python3 scripts/test_crate_gate_chain.py

  gate:
    uses: ./.github/workflows/crate-gate-run.yml
    with:
      targets: '[{"target":"wasm32v1-none","runs_on":"ubuntu-latest","features":"--no-default-features","clippy_args":"-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core","lql":false},{"target":"riscv32i-unknown-none-elf","runs_on":"ubuntu-latest","features":"--no-default-features","clippy_args":"-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core","lql":false},{"target":"riscv32im-unknown-none-elf","runs_on":"ubuntu-latest","features":"--no-default-features","clippy_args":"-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core","lql":false},{"target":"riscv32imac-unknown-none-elf","runs_on":"ubuntu-latest","features":"--no-default-features","clippy_args":"-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core","lql":false},{"target":"riscv32imafc-unknown-none-elf","runs_on":"ubuntu-latest","features":"--no-default-features","clippy_args":"-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core","lql":false},{"target":"riscv32imc-unknown-none-elf","runs_on":"ubuntu-latest","features":"--no-default-features","clippy_args":"-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core","lql":false},{"target":"riscv64gc-unknown-none-elf","runs_on":"ubuntu-latest","features":"--no-default-features","clippy_args":"-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core","lql":false},{"target":"riscv64imac-unknown-none-elf","runs_on":"ubuntu-latest","features":"--no-default-features","clippy_args":"-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core","lql":false},{"target":"aarch64-unknown-none","runs_on":"ubuntu-latest","features":"--no-default-features","clippy_args":"-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core","lql":false},{"target":"x86_64-unknown-none","runs_on":"ubuntu-latest","features":"--no-default-features","clippy_args":"-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core","lql":false},{"target":"aarch64-unknown-uefi","runs_on":"ubuntu-latest","features":"--no-default-features","clippy_args":"-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core","lql":false},{"target":"x86_64-unknown-uefi","runs_on":"ubuntu-latest","features":"--no-default-features","clippy_args":"-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core","lql":false}]'
