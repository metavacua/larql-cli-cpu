# Crate gate: one run per crate in larql-cli's dependency graph.
#
# The crate comes from the branch name (experiment/crate/<package>); any other branch skips
# everything. Crate PRs are based on experiment/crate-gate, not main: GitHub filters
# pull_request on the base branch and has no head-branch filter, so that is what keeps fifteen
# crate PRs from waking every shared workflow fifteen times
# (scripts/test_workflow_triggers.py asserts it).
#
#   fmt                      once per crate; a failure ends the run
#   per target, in parallel  clippy -> cargo build -> lql-strategy-matrix (strict)
#   cross-target             structural agreement of the lql instances (read-only; no write token)
#
# clippy is per target because its lints depend on the cfg set the target selects; fmt is not.
# A failure at any stage ends that target only. The freestanding Tier 2 without-host-tools
# targets use --no-default-features and the core/alloc/std lints; the gnu targets use default
# features. lql runs where the CLI can run: natively on x86_64 and aarch64 Linux, and under
# QEMU user-mode on riscv64gc-unknown-linux-gnu; the freestanding targets have no OS. The
# 32-bit riscv ladder i -> im -> imac -> imafc (+M, +A+C, +F) is an elimination: imac is the
# control that isolates floating point from imafc. imc, riscv64imac and windows-gnu are trimmed. For now only
# SmolLM2-135M (base and instruct) must pass; the heavier models are off.
# Order and sharing rules: scripts/test_crate_gate_chain.py.
name: crate-gate

on:
  pull_request:
    branches: [main, experiment/crate-gate]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which workflows a crate branch wakes, every workflow's permissions and concurrency, and
  # the order of this gate are themselves under test, so an edit cannot silently start another
  # round of cancelled and queued runs, widen a token or reorder the stages.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install --quiet pyyaml
      - run: python3 scripts/test_workflow_triggers.py
      - run: python3 scripts/test_workflow_hygiene.py
      - run: python3 scripts/test_crate_gate_chain.py

  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      crate: ${{ steps.r.outputs.crate }}
      kind: ${{ steps.r.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
      - id: r
        run: |
          branch="${GITHUB_HEAD_REF}"
          crate="${branch#experiment/crate/}"
          if [ "$crate" = "$branch" ]; then
            echo "not a crate branch ($branch): nothing to gate"
            echo "crate=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          meta=$(cargo metadata --no-deps --format-version 1)
          echo "$meta" | jq -e --arg c "$crate" '.packages[] | select(.name == $c)' > /dev/null \
            || { echo "::error::$branch names no workspace package '$crate'"; exit 1; }
          kind=bin
          echo "$meta" | jq -e --arg c "$crate" '.packages[] | select(.name == $c) | .targets[] | select(.kind | index("lib"))' > /dev/null && kind=lib
          echo "crate=$crate" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "gating $crate ($kind)"

  fmt:
    needs: resolve
    if: needs.resolve.outputs.crate != ''
    name: fmt · ${{ needs.resolve.outputs.crate }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt -p ${{ needs.resolve.outputs.crate }} -- --check

  chain:
    name: ${{ matrix.t.target }}
    needs: [resolve, fmt]
    if: needs.resolve.outputs.crate != ''
    strategy:
      fail-fast: false # a red target hides none of the others
      matrix:
        t:
          - { target: wasm32v1-none, runs_on: ubuntu-latest, features: "--no-default-features", clippy_args: "-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core", lql: false, setup: "", emulator: "" }
          - { target: riscv32i-unknown-none-elf, runs_on: ubuntu-latest, features: "--no-default-features", clippy_args: "-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core", lql: false, setup: "", emulator: "" }
          - { target: riscv32im-unknown-none-elf, runs_on: ubuntu-latest, features: "--no-default-features", clippy_args: "-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core", lql: false, setup: "", emulator: "" }
          - { target: riscv32imac-unknown-none-elf, runs_on: ubuntu-latest, features: "--no-default-features", clippy_args: "-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core", lql: false, setup: "", emulator: "" }
          - { target: riscv32imafc-unknown-none-elf, runs_on: ubuntu-latest, features: "--no-default-features", clippy_args: "-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core", lql: false, setup: "", emulator: "" }
          - { target: riscv64gc-unknown-none-elf, runs_on: ubuntu-latest, features: "--no-default-features", clippy_args: "-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core", lql: false, setup: "", emulator: "" }
          - { target: aarch64-unknown-none, runs_on: ubuntu-latest, features: "--no-default-features", clippy_args: "-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core", lql: false, setup: "", emulator: "" }
          - { target: x86_64-unknown-none, runs_on: ubuntu-latest, features: "--no-default-features", clippy_args: "-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core", lql: false, setup: "", emulator: "" }
          - { target: aarch64-unknown-uefi, runs_on: ubuntu-latest, features: "--no-default-features", clippy_args: "-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core", lql: false, setup: "", emulator: "" }
          - { target: x86_64-unknown-uefi, runs_on: ubuntu-latest, features: "--no-default-features", clippy_args: "-W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core", lql: false, setup: "", emulator: "" }
          - { target: x86_64-unknown-linux-gnu, runs_on: ubuntu-latest, features: "", clippy_args: "", lql: true, setup: "", emulator: "" }
          - { target: aarch64-unknown-linux-gnu, runs_on: ubuntu-24.04-arm, features: "", clippy_args: "", lql: true, setup: "", emulator: "" }
          - { target: riscv64gc-unknown-linux-gnu, runs_on: ubuntu-latest, features: "", clippy_args: "", lql: true, setup: scripts/ci/riscv64gc_qemu.sh, emulator: "qemu-riscv64-static -cpu rv64 -L /usr/riscv64-linux-gnu" }
    uses: ./.github/workflows/crate-gate-chain.yml
    with:
      crate: ${{ needs.resolve.outputs.crate }}
      kind: ${{ needs.resolve.outputs.kind }}
      target: ${{ matrix.t.target }}
      runs_on: ${{ matrix.t.runs_on }}
      features: ${{ matrix.t.features }}
      clippy_args: ${{ matrix.t.clippy_args }}
      lql: ${{ matrix.t.lql }}
      setup: ${{ matrix.t.setup }}
      emulator: ${{ matrix.t.emulator }}
    secrets: inherit

  # Structural agreement between targets: the same crate, run through the same SmolLM2-135M
  # legs on x86_64, aarch64 and riscv64 (QEMU), must agree on mechanically decidable facts
  # (scripts/lql_matrix/cross_target.py). It judges no model answer: a disagreement means
  # something target-specific broke.
  #   COMPARED: legs present; produce outcome; descriptor family/quant/generation/produced/
  #     has_model_weights; STATS feature_count; per cell presence, bucket, exit_code and the
  #     in-band err_signal (only for cells outside FP_DEPENDENT_CATS, whose Error verdict can
  #     legitimately flip on float rounding).
  #   NOT COMPARED: stdout/stderr and err_line text, floats, durations, and any cell or
  #     produce that timed out or was hard-killed (exit 124/137), which depends on speed.
  #   --slow-tag riscv64gc-unknown-linux-gnu is the QEMU-emulated target and the ONLY one
  #     excused: there a timeout/124/137 or a missing leg or cell is inconclusive. On a native
  #     target (x86_64, aarch64) a timeout where a peer finished the same cell, or a missing
  #     leg, is a conclusive disagreement. It is explicit here; the script infers nothing.
  # This needs NO write permission, so none is granted (workflow-level contents: read only):
  #   - artifacts inside one run travel on the Actions runtime token, which upload/download-
  #     artifact use directly; that is not a GITHUB_TOKEN scope, so contents: read suffices;
  #   - the step summary is a local file ($GITHUB_STEP_SUMMARY) the runner publishes itself;
  #   - the verdict is the exit code. No PR comment, check run or commit status is written.
  # Runs even when a chain failed (!cancelled()), so a red freestanding target hides nothing;
  # it compares whichever lql instances uploaded artifacts.
  cross-target:
    name: cross-target
    needs: [resolve, chain]
    if: ${{ !cancelled() && needs.resolve.outputs.crate != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: 'results-*'
          path: artifacts
      - name: Compare targets
        run: |
          status=0
          python3 scripts/lql_matrix/cross_target.py "artifacts/results-*/results-*.jsonl" \
            --slow-tag riscv64gc-unknown-linux-gnu \
            --expect-tag x86_64-unknown-linux-gnu \
            --expect-tag aarch64-unknown-linux-gnu \
            --expect-tag riscv64gc-unknown-linux-gnu \
            --strict --out-md cross-target.md --out-json cross-target.json || status=$?
          cat cross-target.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $status
