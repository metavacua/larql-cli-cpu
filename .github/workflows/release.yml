# Tagged release binaries (ADR-0026). Cross-builds the CPU-only `larql`
# CLI for the platforms larql-cli.yml already validates on every push, and
# attaches one archive per platform to a GitHub Release.
#
# Deliberately NOT crates.io publishing — see ADR-0026 for why. These are
# build artifacts, versioned by tag, with no semver/API-stability
# commitment attached.
#
# Feature flags: larql-cli's defaults are `research` and `net`. Release
# binaries drop only `research` (dev builds and CI keep the `larql dev`
# tree, k3-ledger, moe-locality, optimizer-mcp and `shannon verify`) and
# KEEP `net`, so every leg passes `--no-default-features --features net`.
# Passing bare --no-default-features would silently strip networking
# (pull, hf, publish, serve, server-capabilities, `dec-bench replay`,
# `--ffn` and the `--v3-*-shards` transports) from the tagged archives.
# larql-cli.yml carries a clippy step for exactly this release shape.
#
# `dec-bench` is deliberately NOT research-gated: upstream's DEC drivers
# run `dec-bench replay` from a release archive, and `replay` ships
# because `net` is on. Those drivers, and the `larql-server` they pair
# it with, are not part of this repository.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    name: build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            features: "--no-default-features --features net"
          # Pinned to 22.04, NOT ubuntu-latest: the runner's glibc sets the
          # binary's minimum. 24.04 (glibc 2.39) emitted a GLIBC_2.38
          # requirement, which will not load on Colab or any 22.04-class rented
          # box — i.e. exactly the hosts ADR-0026 exists to serve. Raise this
          # only when every DEC target host has moved past it.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: "--no-default-features --features net"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: "--no-default-features --features net"

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install OpenBLAS (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config

      - name: Install OpenBLAS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$vcpkgRoot\vcpkg.exe" install openblas:x64-windows

      # protoc on PATH satisfies the `cfg(not(windows))` skip in
      # `larql-router-protocol`. See its build.rs for the rationale.
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc -y --no-progress

      - name: Cache cargo registry (downloads only, never target/)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg2-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg2-release-

      - name: No compiled workspace artefacts may be restored
        shell: bash
        run: |
          # The cache above carries downloads only. A target/ restored from
          # another commit can satisfy a link against stale code, so a green
          # matrix would be evidence about an artefact that is not in this
          # commit. Fail loudly rather than build on one.
          if [ -e target ]; then
            echo "::error::target/ was restored from cache - the cache key or path is wrong"
            exit 1
          fi

      - name: Build (release-dist profile)
        run: cargo build --profile release-dist --target ${{ matrix.target }} -p larql-cli ${{ matrix.features }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          out="larql-${{ matrix.target }}"
          mkdir -p "$out"
          cp target/${{ matrix.target }}/release-dist/larql "$out/"
          tar czf "${out}.tar.gz" "$out"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "larql-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $out
          Copy-Item "target\${{ matrix.target }}\release-dist\larql.exe" "$out\"
          Compress-Archive -Path $out -DestinationPath "$out.zip"

      - name: Upload artefact
        uses: actions/upload-artifact@v7
        with:
          name: larql-${{ matrix.target }}
          path: |
            larql-${{ matrix.target }}.tar.gz
            larql-${{ matrix.target }}.zip
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
