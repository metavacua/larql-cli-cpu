# Reduction experiment: how much of larql survives when the ISA is cut down?
#
# Compile axis  - the no_std leaf crates must build, with core/alloc built from source,
#                 for an integer ladder: RV32I (the floor; no RV64I target exists), RV64IM, RV64IMAC. No
#                 FPU, no OS, so larql-cli cannot target these; the CLI is reduced
#                 at runtime instead (below).
# Runtime axis  - the same `larql` command set runs on x86_64-gnu (reference) and on
#                 riscv64gc-gnu under qemu-user with progressively fewer CPU
#                 features. scripts/riscv_reduction/classify.py labels each command
#                 identical / similar / refused / divergent. `refused` is strict
#                 inclusion (the reduced build does less); `divergent` fails the job.
#
# Triggers: push to experiment/** and any pull_request, so this is testable from
# a branch with nothing merged to main. workflow_dispatch is deliberately absent:
# GitHub only offers it once the file is on the default branch.
name: riscv-reduction

on:
  push:
    branches: ['experiment/**']
  pull_request:

permissions:
  contents: read

# push and pull_request both fire once a PR exists for the branch. Keying on the
# branch name (head_ref for PRs, ref_name for pushes) makes them one group, so the
# duplicate is cancelled instead of run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # core and alloc are built from source (-Zbuild-std), so no target needs a
  # prebuilt rust-std and the RV64 integer ladder below is reachable. RUSTC_BOOTSTRAP
  # keeps the compiler on the pinned toolchain instead of switching to nightly.
  # The stable-only rule belongs to target-matrix.yml, not to this experiment.
  compile-nostd:
    name: compile · ${{ matrix.target }}+${{ matrix.layer }} · ${{ matrix.crate }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTC_BOOTSTRAP: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: larql-execution, target: riscv32i-unknown-none-elf, layer: alloc, build_std: 'core,alloc', features: '--no-default-features --features alloc' }
          - { crate: larql-execution, target: riscv32i-unknown-none-elf, layer: core,  build_std: 'core',       features: '--no-default-features' }
          - { crate: larql-execution, target: riscv64im-unknown-none-elf, layer: alloc, build_std: 'core,alloc', features: '--no-default-features --features alloc' }
          - { crate: larql-execution, target: riscv64im-unknown-none-elf, layer: core,  build_std: 'core',       features: '--no-default-features' }
          - { crate: larql-execution, target: riscv64imac-unknown-none-elf, layer: alloc, build_std: 'core,alloc', features: '--no-default-features --features alloc' }
          - { crate: larql-execution, target: riscv64imac-unknown-none-elf, layer: core,  build_std: 'core',       features: '--no-default-features' }
          - { crate: larql-execution, target: riscv64gc-unknown-none-elf, layer: alloc, build_std: 'core,alloc', features: '--no-default-features --features alloc' }
          - { crate: larql-execution, target: riscv64gc-unknown-none-elf, layer: core,  build_std: 'core',       features: '--no-default-features' }
          - { crate: larql-execution, target: x86_64-unknown-none, layer: alloc, build_std: 'core,alloc', features: '--no-default-features --features alloc' }
          - { crate: larql-execution, target: x86_64-unknown-none, layer: core,  build_std: 'core',       features: '--no-default-features' }
          - { crate: larql-execution, target: aarch64-unknown-none, layer: alloc, build_std: 'core,alloc', features: '--no-default-features --features alloc' }
          - { crate: larql-execution, target: aarch64-unknown-none, layer: core,  build_std: 'core',       features: '--no-default-features' }
          - { crate: larql-execution, target: x86_64-unknown-uefi, layer: alloc, build_std: 'core,alloc', features: '--no-default-features --features alloc' }
          - { crate: larql-execution, target: x86_64-unknown-uefi, layer: core,  build_std: 'core',       features: '--no-default-features' }
          - { crate: larql-execution, target: aarch64-unknown-uefi, layer: alloc, build_std: 'core,alloc', features: '--no-default-features --features alloc' }
          - { crate: larql-execution, target: aarch64-unknown-uefi, layer: core,  build_std: 'core',       features: '--no-default-features' }
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rust-src
      - name: cargo check --lib -Zbuild-std (checked against no-std-policy.json)
        run: |
          set +e
          cargo check -Zbuild-std=${{ matrix.build_std }} --target ${{ matrix.target }} -p ${{ matrix.crate }} --lib ${{ matrix.features }}
          ec=$?
          set -e
          python3 scripts/check_no_std_policy.py "${{ matrix.crate }}" "${{ matrix.target }}+${{ matrix.layer }}" "$ec" check \
            "crates/${{ matrix.crate }}/no-std-policy.json"
      # CI-only: --fix rewrites files, so it never runs on the dev machine. The tree
      # must come back clean; a diff is the fix to commit. Lints are per target
      # because clippy's findings depend on the cfg set the target selects.
      - name: 'cargo clippy --fix: core/alloc/std restriction lints (target-scoped)'
        run: |
          set +e
          cargo clippy --fix --allow-dirty --allow-staged -Zbuild-std=${{ matrix.build_std }} \
            --target ${{ matrix.target }} -p ${{ matrix.crate }} --lib --no-deps ${{ matrix.features }} -- \
            -W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core
          clippy_ec=$?
          mkdir -p fixes
          git diff -- "crates/${{ matrix.crate }}" | tee "fixes/${{ matrix.crate }}-${{ matrix.target }}-${{ matrix.layer }}.patch"
          [ -s "fixes/${{ matrix.crate }}-${{ matrix.target }}-${{ matrix.layer }}.patch" ] || rm -f "fixes/${{ matrix.crate }}-${{ matrix.target }}-${{ matrix.layer }}.patch"
          git diff --exit-code -- "crates/${{ matrix.crate }}" > /dev/null
          diff_ec=$?
          set -e
          if [ "$clippy_ec" -ne 0 ]; then ec=$clippy_ec; else ec=$diff_ec; fi
          python3 scripts/check_no_std_policy.py "${{ matrix.crate }}" "${{ matrix.target }}+${{ matrix.layer }}" "$ec" clippy-fix \
            "crates/${{ matrix.crate }}/no-std-policy.json"
      # Apply on the dev machine with: gh run download <id> -n clippy-fix-<crate>-<target> && git apply fixes/*.patch
      - name: Upload clippy --fix patch (only when it is non-empty)
        if: always() && hashFiles(format('fixes/{0}-{1}.patch', matrix.crate, format('{0}-{1}', matrix.target, matrix.layer))) != ''
        uses: actions/upload-artifact@v4
        with:
          name: clippy-fix-${{ matrix.crate }}-${{ matrix.target }}-${{ matrix.layer }}
          path: fixes/
          retention-days: 7
      - name: host tests still pass with the crate no_std
        if: matrix.target == 'riscv64imac-unknown-none-elf' && matrix.layer == 'alloc'
        run: cargo test --locked -p ${{ matrix.crate }}

  # Informational: every library crate except the larql-cli binary is expected to compile
  # across the chain (std on gnu, core+alloc on uefi, core on none). Where one does not,
  # that is the data for how to rearrange it, so this job records every failing crate in
  # one pass (--keep-going) instead of gating. Nothing here fails the PR.
  inventory-chain:
    name: inventory · ${{ matrix.target }} (${{ matrix.layer }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    env:
      RUSTC_BOOTSTRAP: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: riscv32i-unknown-none-elf,    layer: core,       build_std: core }
          - { target: riscv64im-unknown-none-elf,   layer: core,       build_std: core }
          - { target: riscv64imac-unknown-none-elf, layer: core,       build_std: core }
          - { target: riscv64gc-unknown-none-elf,   layer: core,       build_std: core }
          - { target: aarch64-unknown-none,         layer: core,       build_std: core }
          - { target: x86_64-unknown-none,          layer: core,       build_std: core }
          - { target: x86_64-unknown-uefi,          layer: core+alloc, build_std: 'core,alloc' }
          - { target: aarch64-unknown-uefi,         layer: core+alloc, build_std: 'core,alloc' }
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rust-src
      # Host-side build scripts (tonic/prost, system BLAS probing) run on the runner; install
      # what they need so their failure does not hide the target-side result.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libopenblas-dev pkg-config
      - name: cargo check --keep-going (workspace minus larql-cli)
        run: |
          set +e
          cargo check --keep-going -Zbuild-std=${{ matrix.build_std }} --target ${{ matrix.target }} \
            --workspace --exclude larql-cli --exclude larql-continuation-fixture --lib --no-default-features \
            2>&1 | tee check.log
          set -e
          {
            echo "### ${{ matrix.target }} (${{ matrix.layer }})"
            echo "Crates that failed to compile:"; echo '```'
            grep -oE 'could not compile `[^`]+`' check.log | sort -u; echo '```'
            echo "Error classes:"; echo '```'
            grep -oE '^error(\[E[0-9]+\])?: .*' check.log | sed -E 's/`[^`]*`/`_`/g' | sort | uniq -c | sort -rn | head -25
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-${{ matrix.target }}
          path: check.log
          retention-days: 7

  runtime-matrix:
    name: runtime · x86_64-gnu vs riscv64gc-gnu (qemu cpu masks)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchains, QEMU and native OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu g++-riscv64-linux-gnu \
            libc6-dev-riscv64-cross qemu-user-static libopenblas-dev pkg-config
          rustup target add riscv64gc-unknown-linux-gnu
      - name: Install OpenBLAS for riscv64 (ports archive)
        run: |
          sudo dpkg --add-architecture riscv64
          CODENAME=$(lsb_release -cs)
          {
            echo "deb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports $CODENAME main universe"
            echo "deb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports $CODENAME-updates main universe"
            echo "deb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports $CODENAME-security main universe"
          } | sudo tee /etc/apt/sources.list.d/ports-riscv64.list
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/ports-riscv64.list" \
            -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y libopenblas-dev:riscv64
          {
            echo "PKG_CONFIG_ALLOW_CROSS=1"
            echo "PKG_CONFIG_PATH_riscv64_unknown_linux_gnu=/usr/lib/riscv64-linux-gnu/pkgconfig"
            echo "CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc"
            echo "QEMU_LD_PREFIX=/usr/riscv64-linux-gnu"
          } >> "$GITHUB_ENV"
      - name: Build larql (x86_64 reference)
        run: cargo build --locked --release -p larql-cli --bin larql
      - name: Build larql (riscv64gc)
        run: cargo build --locked --release --target riscv64gc-unknown-linux-gnu -p larql-cli --bin larql
      - name: Capture reference, riscv full CPU, riscv without F/D
        run: |
          S=scripts/riscv_reduction/capture.sh
          $S out/x86 target/release/larql
          $S out/rv-full target/riscv64gc-unknown-linux-gnu/release/larql qemu-riscv64-static -cpu rv64 -L /usr/riscv64-linux-gnu
          # F/D off: a float instruction then raises SIGILL (rc 132). QEMU rejects a CPU whose
          # extensions depend on F/D, so discover the accepted mask first and record it.
          BIN=target/riscv64gc-unknown-linux-gnu/release/larql
          CPU=$(python3 scripts/riscv_reduction/cpu_mask.py /usr/riscv64-linux-gnu "$BIN")
          echo "F/D-free CPU: $CPU" | tee -a "$GITHUB_STEP_SUMMARY"
          $S out/rv-nofd "$BIN" qemu-riscv64-static -cpu "$CPU" -L /usr/riscv64-linux-gnu
      - name: Classify
        run: |
          rc=0
          {
            python3 scripts/riscv_reduction/classify.py out/x86 out/rv-full "x86_64 vs riscv64gc (full CPU)" || rc=1
            python3 scripts/riscv_reduction/classify.py out/x86 out/rv-nofd "x86_64 vs riscv64 without F/D" || rc=1
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riscv-reduction-captures
          path: out/
          retention-days: 7
