name: portability

on:
  push:
    branches: [main]
    paths:
      - 'crates/larql-compute/**'
      - 'crates/larql-cli/**'
      - 'crates/larql-continuation-fixture/**'
      - 'crates/larql-router/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/portability.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/larql-compute/**'
      - 'crates/larql-cli/**'
      - 'crates/larql-continuation-fixture/**'
      - 'crates/larql-router/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/portability.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LARQL_SPIN_POOL: 0

jobs:
  arm-kernels:
    name: generic AArch64 kernels, with and without dotprod
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Activate the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install OpenBLAS and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config qemu-user
      # The explicit triple keeps the generic ARMv8-A baseline. A compile
      # without target-cpu=native must work before either runtime is tested.
      - name: Quantized kernel parity on the native CPU
        run: cargo test --locked -p larql-compute --no-default-features --target aarch64-unknown-linux-gnu --lib q4k_q8k_dot
      - name: Quantized kernel parity on ARMv8-A without dotprod
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: 'qemu-aarch64 -cpu cortex-a53 -L /'
        run: cargo test --locked -p larql-compute --no-default-features --target aarch64-unknown-linux-gnu --lib q4k_q8k_dot
      - name: C quantized kernel parity on ARMv8-A without dotprod
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: 'qemu-aarch64 -cpu cortex-a53 -L /'
        run: cargo test --locked -p larql-compute --no-default-features --target aarch64-unknown-linux-gnu --lib q4_matvec

  # The run-time CPU floor for x86_64. The aarch64 job above runs the kernels on
  # a CPU without dotprod; this is the same control for x86, where every hosted
  # runner has AVX2 and the scalar fallback therefore never executes anywhere.
  #
  # Rust's run-time detection cannot be overridden by an environment variable
  # (RUST_STD_DETECT_UNSTABLE and glibc tunables both leave
  # is_x86_feature_detected! unchanged), so the CPU is emulated: qemu-user with
  # a CPU model that really lacks the feature, as for cortex-a53 above.
  #
  #   qemu64       no SSE4.2, no AVX    the x86-64 baseline
  #   Nehalem      SSE4.2, no AVX
  #   SandyBridge  AVX, no AVX2, no FMA the most common real-world gap
  #   native       AVX2                 positive control: the fast kernel runs
  #
  # Each leg declares the kernel class it expects (LARQL_EXPECT_Q4K_MATVEC_KERNEL),
  # so landing on the wrong CPU, or a dispatch that stops choosing the fallback,
  # is a failure and not a pass. The native leg also requires AVX2
  # (LARQL_REQUIRE_CPU_FEATURES), so the AVX2-vs-scalar parity test cannot skip
  # there. See crates/larql-compute/.../tests/cpu_floor.rs.
  x86-cpu-floor:
    name: x86_64 kernels on ${{ matrix.cpu }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: native
            kernel: avx2
            require: avx2
          - cpu: qemu64
            kernel: scalar
            require: ''
          - cpu: Nehalem
            kernel: scalar
            require: ''
          - cpu: SandyBridge
            kernel: scalar
            require: ''
    env:
      LARQL_EXPECT_Q4K_MATVEC_KERNEL: ${{ matrix.kernel }}
      LARQL_REQUIRE_CPU_FEATURES: ${{ matrix.require }}
    steps:
      - uses: actions/checkout@v7
      - name: Activate the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install OpenBLAS and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config qemu-user
      - name: Run test binaries under the CPU model
        if: matrix.cpu != 'native'
        run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=qemu-x86_64 -cpu ${{ matrix.cpu }} -L /" >> "$GITHUB_ENV"
      # The explicit triple keeps build scripts on the host and applies the
      # runner only to the test binary. A filter that matches nothing exits 0,
      # so require that the control actually ran.
      - name: The leg is on the CPU it claims
        run: |
          set -o pipefail
          cargo test --locked -p larql-compute --no-default-features --target x86_64-unknown-linux-gnu --lib kernel_class_is_the_one_this_leg_expects 2>&1 | tee control.log
          grep -Eq 'test result: ok\. 1 passed' control.log
      - name: Quantized kernel parity on this CPU
        run: cargo test --locked -p larql-compute --no-default-features --target x86_64-unknown-linux-gnu --lib q4k_q8k_dot

  cross-plugin:
    name: x86_64 plugin fixture from an ARM64 host
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Activate the pinned Rust toolchain
        run: rustup show active-toolchain
      # Run rustup inside the checkout so rust-toolchain.toml selects the
      # pinned compiler, including when stable has advanced beyond it.
      - name: Install the consuming test's target
        run: rustup target add x86_64-apple-darwin
      - name: Verify Rosetta is available
        run: arch -x86_64 /usr/bin/true
      - name: Build and load the target-matched plugin through the CLI
        run: cargo test --locked -p larql-cli --no-default-features --target x86_64-apple-darwin --test test_continuation_plugin_cli

  router-windows:
    name: MoE hedge failure on Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Activate the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install protoc
        run: choco install protoc -y --no-progress
      - name: MoE hedge and failure cases
        run: cargo test --locked -p larql-router --no-default-features --test test_http_handlers moe_hedge_and_failure
