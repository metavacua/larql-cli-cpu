# larql-cli cross-platform CI
#
# Top-level `larql` binary, CPU-only. Default features are `research` and
# `net`, so the same surface — research tooling and networking included —
# builds and tests on Linux, Windows and macOS.
#
# Tagged release binaries are built WITHOUT `research` but WITH `net`
# (`--no-default-features --features net`, release.yml), so each OS also
# runs clippy on that exact release shape. Two further shapes are
# clippy-checked: local-only (`--no-default-features`, no networking, the
# network verbs refuse loudly) and research-without-net.
#
# `convert_moe_to_per_layer` example currently doesn't build against
# the post-refactor `larql-inference` API; CI checks bins + tests
# instead of `--all-targets` until that example is repaired.

name: larql-cli

on:
  push:
    branches: [main]
    paths:
      - 'crates/larql-cli/**'
      - 'docs/generated/**'
      - 'crates/larql-lql/**'
      - 'crates/larql-kv/**'
      # the C6 gate builds and loads this fixture (it includes the C5
      # provider from crates/larql-kv/tests, already covered above)
      - 'crates/larql-continuation-fixture/**'
      - 'crates/larql-vindex/**'
      - 'crates/larql-models/**'
      - 'crates/larql-inference/src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-cli.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/larql-cli/**'
      - 'docs/generated/**'
      - 'crates/larql-lql/**'
      - 'crates/larql-kv/**'
      # the C6 gate builds and loads this fixture (it includes the C5
      # provider from crates/larql-kv/tests, already covered above)
      - 'crates/larql-continuation-fixture/**'
      - 'crates/larql-vindex/**'
      - 'crates/larql-models/**'
      - 'crates/larql-inference/src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-cli.yml'
  workflow_dispatch: {}

# Supersede in-flight pull-request runs: pushing a new commit to a PR
# cancels the runs still compiling the previous one.
#
# Non-PR runs (main pushes, schedules, manual dispatch) are keyed by
# `run_id`, which is unique per run, so they are each alone in their
# group. That is deliberate and not the same as `cancel-in-progress:
# false`: a concurrency group holds at most one running and one pending
# run, and a newer pending run EVICTS the older pending one. Grouping
# every main push under `refs/heads/main` would therefore still destroy
# the CI record for an intermediate main commit when merges land close
# together, with cancellation disabled or not.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install OpenBLAS (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config

      - name: Install OpenBLAS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$vcpkgRoot\vcpkg.exe" install openblas:x64-windows

      # protoc on PATH satisfies the `cfg(not(windows))` skip in
      # `larql-router-protocol` / `larql-server`. See those build.rs
      # files for the rationale.
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc -y --no-progress

      - name: Cache cargo registry (downloads only, never target/)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg2-cli-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg2-cli-

      - name: No compiled workspace artefacts may be restored
        shell: bash
        run: |
          # The cache above carries downloads only. A target/ restored from
          # another commit can satisfy a link against stale code, so a green
          # matrix would be evidence about an artefact that is not in this
          # commit. Fail loudly rather than build on one.
          if [ -e target ]; then
            echo "::error::target/ was restored from cache - the cache key or path is wrong"
            exit 1
          fi

      - name: Format check
        run: cargo fmt -p larql-cli -- --check

      - name: Check
        run: cargo check -p larql-cli --bins --tests

      # Re-enabled 2026-08-06 (issue #169). The backlog this step was
      # disabled for on 2026-05-10 — ~82 errors under default features and
      # ~112 under `--no-default-features`, mostly `large_enum_variant` and
      # `dead_code` on metal-only paths — has since been cleared by other
      # work. Both feature shapes now report zero under `-D warnings`.
      #
      # `--no-deps` matches the other crates' workflows: it keeps the gate
      # on larql-cli's own code, so a lint that fires in a path dependency
      # reds that dependency's workflow rather than this one.
      - name: Clippy
        run: cargo clippy -p larql-cli --bins --tests --no-deps -- -D warnings

      # The shape release.yml ships: no `research`, `net` on. A research-only
      # helper left reachable from a shipped verb (or dead without it) reds
      # here, not in a tagged release build.
      - name: Clippy (release shape, no research, net on)
        run: cargo clippy -p larql-cli --bins --tests --no-default-features --features net --no-deps -- -D warnings

      # Local-only: no networking. Every cfg(feature = "net") item must leave
      # no unused import / dead code behind, and the net verbs refuse loudly.
      - name: Clippy (local-only, no research, no net)
        run: cargo clippy -p larql-cli --bins --tests --no-default-features --no-deps -- -D warnings

      # research without net: a research verb that reaches the network must
      # still compile (and refuse) here.
      - name: Clippy (research, no net)
        run: cargo clippy -p larql-cli --bins --tests --no-default-features --features research --no-deps -- -D warnings

      # Includes `current_documentation_facts_match_clap`, which holds
      # docs/generated/current-facts.json to the actual Clap tree.
      - name: Tests
        run: cargo test -p larql-cli

      # The no-net run exercises net_gate's unit tests and
      # tests/net_refusal.rs (loud refusal for every net verb and for
      # `run`/`bench --ffn` before any model resolution).
      - name: Tests (local-only, no net)
        if: runner.os == 'Linux'
        run: cargo test -p larql-cli --no-default-features

      - name: Tests (release shape, net without research)
        if: runner.os == 'Linux'
        run: cargo test -p larql-cli --no-default-features --features net

      # R3B: validates the checked-out PR's own registry/index.json +
      # registry/models/*.json, through the exact assembly/validation
      # code production_registry() uses (include_str! embeds whatever
      # this checkout has at build time) — never a parallel checker
      # that could drift from what the shipped binary actually accepts.
      # Runs on all three OSes so a platform-specific path bug (the
      # Windows-absolute-path class registry/reference.rs already hit
      # once) shows up here too, not just in unit tests.
      - name: Registry check (CPU only) on Linux/Windows
        if: runner.os != 'macOS'
        run: cargo run -p larql-cli --no-default-features --features research -- registry check

      - name: Registry check (default features) on macOS
        if: runner.os == 'macOS'
        run: cargo run -p larql-cli -- registry check

  coverage:
    name: coverage - ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage summary
        run: cargo llvm-cov --package larql-cli --no-default-features --features research,net --summary-only
