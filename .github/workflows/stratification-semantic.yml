# Semantic layer of the stratification matrix, from rust-analyzer's CLI.
#
# stratification-matrix.yml asks the compiler (does it build on T) and
# ast-grep (what the syntax says). Neither knows what the code actually
# RESOLVES to. rust-analyzer does, and loading a whole workspace (build
# scripts, proc macros, name resolution) is exactly the memory-heavy work
# that must not happen on the dev machine - so it happens here.
#
#   lsif   -> symbol-level reference graph -> crate -> crate reference counts
#             (actual-use.json); stratify_aggregate.py turns them into the
#             matrix N and Dead = D * (N == 0) beside the declared edges D.
#   diag   -> per-target semantic diagnostics. `cargo.target` is set through
#             a runner-local rust-analyzer.toml (never committed), so cfg
#             resolution follows the target: `inactive-code` marks what that
#             target compiles out, unresolved-* what it cannot reach.
#
# Steps record outcomes as data and print raw output; a step that cannot run
# is visible in the log, never silently skipped.
name: stratification-semantic

on:
  push:
    branches: [worktree-target-stratification-matrix]
    paths:
      - .github/workflows/stratification-semantic.yml
      - scripts/stratify_lsif.py
  workflow_dispatch:
    inputs:
      subject_ref:
        description: Branch or SHA to analyse (default - the ref this workflow runs from)
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  lsif:
    name: lsif · crate x crate actual use
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.subject_ref || github.sha }}
          path: subject
      - name: Install rust-analyzer on the pinned toolchain and system OpenBLAS
        working-directory: subject
        run: |
          rustup component add rust-analyzer
          rust-analyzer --version
          rust-analyzer --help
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config
      - name: Cache cargo registry (downloads only, never target/)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg2-strat-sem-${{ hashFiles('subject/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg2-strat-sem-
      - name: rust-analyzer lsif (whole workspace)
        working-directory: subject
        run: |
          mkdir -p ../sem
          rust-analyzer lsif . > ../sem/workspace.lsif
          wc -l ../sem/workspace.lsif
      - name: Crate -> crate reference counts (input of the N matrix)
        working-directory: subject
        run: python3 ../tools/scripts/stratify_lsif.py --lsif ../sem/workspace.lsif --root "$PWD" --out ../sem/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-lsif
          path: sem/out
          retention-days: 30

  diag:
    name: diagnostics · ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - wasm32-wasip1
          - wasm32v1-none
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.subject_ref || github.sha }}
          path: subject
      - name: Install rust-analyzer, target and system OpenBLAS
        working-directory: subject
        run: |
          rustup component add rust-analyzer
          rustup target add ${{ matrix.target }}
          rust-analyzer diagnostics --help
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config
      - name: Cache cargo registry (downloads only, never target/)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg2-strat-sem-${{ hashFiles('subject/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg2-strat-sem-
      # Runner-local config, never committed: cfg resolution follows `target`.
      - name: Point rust-analyzer at ${{ matrix.target }}
        working-directory: subject
        run: |
          printf '[cargo]\ntarget = "%s"\n' "${{ matrix.target }}" > rust-analyzer.toml
          cat rust-analyzer.toml
      - name: rust-analyzer diagnostics (raw output, unfiltered)
        working-directory: subject
        run: |
          mkdir -p ../diag
          set +e
          rust-analyzer diagnostics . > ../diag/raw.txt 2> ../diag/err.txt
          echo "exit $?" | tee ../diag/exit.txt
          wc -l ../diag/raw.txt ../diag/err.txt
          head -60 ../diag/err.txt
          grep -c "inactive-code" ../diag/raw.txt | sed 's/^/inactive-code: /'
          grep -oE "(unresolved-[a-z-]+|unlinked-file|macro-error|inactive-code|unresolved_[a-z_]+)" ../diag/raw.txt | sort | uniq -c | sort -rn | tee ../diag/by-code.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-diag-${{ matrix.target }}
          path: diag
          retention-days: 30
