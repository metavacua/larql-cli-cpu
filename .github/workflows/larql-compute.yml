# larql-compute cross-platform CI
#
# Validates the CPU backend on Linux, Windows, and macOS. This repository
# carries no GPU backend.
#
# The `dependency-graph` job also guards the BLAS link: Linux/FreeBSD link the
# system OpenBLAS through the in-repo larql-blas-link crate, so no network-capable
# crate (ureq, rustls, native-tls) and neither openblas-src nor openblas-build may
# appear in larql-compute's graph, build- and dev-dependencies included. It
# re-resolves Cargo.lock without --locked and uploads the diff as the
# `cargo-lock-patch` artifact (apply with:
# gh run download <id> -n cargo-lock-patch && git apply cargo-lock.patch).

name: larql-compute

on:
  push:
    # experiment/** so the dependency-graph job (which produces the
    # cargo-lock-patch artifact) runs from a branch with no PR open. Neither a PR
    # nor workflow_dispatch is available before this file is on main.
    branches: [main, 'experiment/**']
    paths:
      - 'crates/larql-compute/**'
      - 'crates/larql-blas-link/**'
      - 'crates/larql-models/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-compute.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/larql-compute/**'
      - 'crates/larql-blas-link/**'
      - 'crates/larql-models/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-compute.yml'
  workflow_dispatch: {}

# Supersede in-flight pull-request runs: pushing a new commit to a PR
# cancels the runs still compiling the previous one.
#
# Non-PR runs (main pushes, schedules, manual dispatch) are keyed by
# `run_id`, which is unique per run, so they are each alone in their
# group. That is deliberate and not the same as `cancel-in-progress:
# false`: a concurrency group holds at most one running and one pending
# run, and a newer pending run EVICTS the older pending one. Grouping
# every main push under `refs/heads/main` would therefore still destroy
# the CI record for an intermediate main commit when merges land close
# together, with cancellation disabled or not.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Route the ambient decode paths through rayon rather than the spin pool.
# A spin barrier needs a free core to spin on; a CI runner (2 cores on
# ubuntu/windows, 3 on macos-14) has none to spare, so the pool's idle
# backoff burns CPU without buying the decode win it exists for.
#
# Measured on the full `--lib` suite (805 tests, 2026-07-30):
#   spin pool on   13.0s wall, 156s CPU
#   LARQL_SPIN_POOL=0    8.1s wall, 112s CPU     (-38% wall, -28% CPU)
#
# This does not cost coverage: `attention::decode::tests` drives *both*
# the spin and rayon arms of `gqa_attention_decode_step` explicitly via
# the thread-local override, and asserts they agree bit-for-bit. The
# pool's own tests in `cpu::spin_pool` construct a `SpinPool` directly
# and are unaffected by this flag either way.
env:
  LARQL_SPIN_POOL: 0

jobs:
  dependency-graph:
    name: Cargo.lock refresh (openblas-src is banned by cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Activate the pinned Rust toolchain
        run: rustup show active-toolchain

      # Re-resolve WITHOUT --locked so a removed dependency is pruned from the
      # lock. Cargo.lock is not regenerated on the dev machine (no cargo there).
      # Until the patch is applied, `--locked` jobs elsewhere fail on a stale lock.
      - name: Refresh Cargo.lock (no --locked)
        run: |
          cargo metadata --format-version 1 > /dev/null
          mkdir -p fixes
          git diff -- Cargo.lock > fixes/cargo-lock.patch
          [ -s fixes/cargo-lock.patch ] || rm -f fixes/cargo-lock.patch

      - name: Upload Cargo.lock patch (only when it is non-empty)
        if: always() && hashFiles('fixes/cargo-lock.patch') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock-patch
          path: fixes/
          retention-days: 7
