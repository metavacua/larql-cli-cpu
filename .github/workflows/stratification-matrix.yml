# Stratification matrix: which workspace unit (package x lib|bin) builds on
# which target, where it first breaks, and which dependency broke it.
#
# target-matrix.yml answers "does the pre-declared expectation hold". This
# answers a different question, and exists because that file's colours
# cannot: its diagnostic steps are `continue-on-error`, and its no_std cells
# map "expected-fail + failed" to green, so a run that is all green can still
# be 100% red underneath. (Read run 36804623863's logs: wasm rungs 1-3 fail in
# getrandom / mio / tokio, and every no_std cell fails inside serde,
# serde_json, thiserror or zmij - a third-party dependency, never the crate
# root the policy files blame.) Nothing here reports a colour as a result:
# each probe job exits 0 whenever it ran, and the facts go to JSON.
#
# Output (artifact `matrices`): labelled integer matrices - dependency D and
# its closure R, unit x target outcome O, target x target agreement and
# implication (O^T O, O^T (1-O)), per-class cause matrices, failing-package
# incidence, dependency-closure deltas, monotonicity V = O * (DU (1-O)) - as
# matrices.json (+ JSON Schema), csv/, mtx/ (Matrix Market) and matrices.npz.
# Definitions are in scripts/stratify_aggregate.py. Source-level AST facts
# (no_std declared, OS-bound std paths, cfg(target), unsafe) from ast-grep are
# a crate x fact matrix joined to the compile results.
#
# Cost control: one job per target compiles every unit in dependency order in
# one target dir, so each third-party package builds once per target, not once
# per cell. Parallelism is capped so this does not starve per-PR CI.
#
# Layers: probe (compiler, per target), ast (ast-grep, syntax), lsif and diag
# (rust-analyzer, name resolution - loading a whole workspace is memory-heavy,
# so it runs here and never on the dev machine), aggregate (matrices).
#
# `subject_ref` points the probe at any branch or SHA while the tooling stays
# at the workflow's own ref, so the same instrument can score main and a
# fixes branch.
name: stratification-matrix

on:
  # A workflow file that is not yet on the default branch cannot be
  # dispatched, so this branch triggers itself on push. Drop this block when
  # the file lands on main; workflow_dispatch is the intended entry point.
  push:
    branches: [worktree-target-stratification-matrix]
    paths:
      - .github/workflows/stratification-matrix.yml
      - scripts/stratify_probe.py
      - scripts/stratify_ast.py
      - scripts/stratify_aggregate.py
      - scripts/stratify_matrix.py
      - scripts/stratify_verify.py
      - scripts/stratify_lsif.py
      - scripts/schemas/stratification-matrices.schema.json
  workflow_dispatch:
    inputs:
      subject_ref:
        description: Branch or SHA to probe (default - the ref this workflow runs from)
        required: false
        default: ''

# Least privilege: nothing by default; each job re-grants only what it uses
# (contents: read, for checkout). Artifact upload/download need no token scope.
permissions: {}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

# One run per subject ref: a newer run on the same ref supersedes the older.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.subject_ref || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    permissions:
      contents: read
    name: probe · ${{ matrix.target }} · ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          # Strict: nothing is faked. A target the runner has no native
          # library for fails honestly (cause class `native-lib-cross`).
          - { target: x86_64-unknown-linux-gnu, mode: strict }
          - { target: aarch64-unknown-linux-gnu, mode: strict, cc: gcc-aarch64-linux-gnu }
          - { target: riscv64gc-unknown-linux-gnu, mode: strict, cc: gcc-riscv64-linux-gnu }
          - { target: x86_64-pc-windows-gnu, mode: strict, cc: gcc-mingw-w64-x86-64 }
          - { target: wasm32-unknown-unknown, mode: strict }
          - { target: wasm32-wasip1, mode: strict }
          - { target: wasm32-unknown-emscripten, mode: strict }
          - { target: wasm32v1-none, mode: strict }
          - { target: riscv32i-unknown-none-elf, mode: strict }
          - { target: riscv32im-unknown-none-elf, mode: strict }
          - { target: riscv32imc-unknown-none-elf, mode: strict }
          - { target: riscv32imac-unknown-none-elf, mode: strict }
          - { target: riscv32imafc-unknown-none-elf, mode: strict }
          - { target: riscv64gc-unknown-none-elf, mode: strict }
          - { target: riscv64imac-unknown-none-elf, mode: strict }
          - { target: aarch64-unknown-none, mode: strict }
          - { target: x86_64-unknown-none, mode: strict }
          - { target: aarch64-unknown-uefi, mode: strict }
          - { target: x86_64-unknown-uefi, mode: strict }
          # Sysroot-assumed: the same libc targets again with
          # PKG_CONFIG_ALLOW_CROSS=1, so a missing target-arch OpenBLAS does
          # not hide Rust-level incompatibilities stacked above it. `check`
          # never links, so this only changes what build scripts are told.
          - { target: aarch64-unknown-linux-gnu, mode: sysroot-assumed, cc: gcc-aarch64-linux-gnu }
          - { target: riscv64gc-unknown-linux-gnu, mode: sysroot-assumed, cc: gcc-riscv64-linux-gnu }
          - { target: x86_64-pc-windows-gnu, mode: sysroot-assumed, cc: gcc-mingw-w64-x86-64 }
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.subject_ref || github.sha }}
          path: subject

      # Plain `rustup target add` from inside the subject, so the repo's
      # pinned toolchain (rust-toolchain.toml) is the one that gains the target
      # - see target-matrix.yml's header for why dtolnay's `targets:` is wrong here.
      - name: Add rustup target
        working-directory: subject
        run: |
          rustup target add ${{ matrix.target }}
          rustc --version --verbose

      - name: Install native OpenBLAS (host) and cross C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config ${{ matrix.cc }}

      - name: Cache cargo registry (downloads only, never target/)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg2-strat-${{ hashFiles('subject/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg2-strat-

      - name: Probe every unit on ${{ matrix.target }} (${{ matrix.mode }})
        working-directory: subject
        run: python3 ../tools/scripts/stratify_probe.py --target ${{ matrix.target }} --mode ${{ matrix.mode }} --out ../out

      - name: Upload probe data and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.target }}-${{ matrix.mode }}
          path: out
          retention-days: 14

  ast:
    permissions:
      contents: read
    name: source AST facts (ast-grep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.subject_ref || github.sha }}
          path: subject
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli
      - name: Scan crates
        working-directory: subject
        run: |
          mkdir -p ../ast-out
          python3 ../tools/scripts/stratify_ast.py --ast-grep "$(command -v ast-grep)" --crates crates --out ../ast-out/ast.json
      - uses: actions/upload-artifact@v4
        with:
          name: ast
          path: ast-out
          retention-days: 14

  lsif:
    permissions:
      contents: read
    name: lsif · crate x crate actual use
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.subject_ref || github.sha }}
          path: subject
      - name: Install rust-analyzer on the pinned toolchain and system OpenBLAS
        working-directory: subject
        run: |
          rustup component add rust-analyzer
          rust-analyzer --version
          rust-analyzer --help
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config
      - name: Cache cargo registry (downloads only, never target/)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg2-strat-sem-${{ hashFiles('subject/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg2-strat-sem-
      - name: rust-analyzer lsif (whole workspace)
        working-directory: subject
        run: |
          mkdir -p ../sem
          rust-analyzer lsif . > ../sem/workspace.lsif
          wc -l ../sem/workspace.lsif
      - name: Crate -> crate reference counts (input of the N matrix)
        working-directory: subject
        run: python3 ../tools/scripts/stratify_lsif.py --lsif ../sem/workspace.lsif --root "$PWD" --out ../sem/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-lsif
          path: sem/out
          retention-days: 30

  diag:
    permissions:
      contents: read
    name: diagnostics · ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - wasm32-wasip1
          - wasm32v1-none
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.subject_ref || github.sha }}
          path: subject
      - name: Install rust-analyzer, target and system OpenBLAS
        working-directory: subject
        run: |
          rustup component add rust-analyzer
          rustup target add ${{ matrix.target }}
          rust-analyzer diagnostics --help
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config
      - name: Cache cargo registry (downloads only, never target/)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg2-strat-sem-${{ hashFiles('subject/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg2-strat-sem-
      # Runner-local config, never committed: cfg resolution follows `target`.
      - name: Point rust-analyzer at ${{ matrix.target }}
        working-directory: subject
        run: |
          printf '[cargo]\ntarget = "%s"\n' "${{ matrix.target }}" > rust-analyzer.toml
          cat rust-analyzer.toml
      - name: rust-analyzer diagnostics (raw output, unfiltered)
        working-directory: subject
        run: |
          mkdir -p ../diag
          set +e
          rust-analyzer diagnostics . > ../diag/raw.txt 2> ../diag/err.txt
          echo "exit $?" | tee ../diag/exit.txt
          wc -l ../diag/raw.txt ../diag/err.txt
          head -60 ../diag/err.txt
          grep -c "inactive-code" ../diag/raw.txt | sed 's/^/inactive-code: /'
          grep -oE "(unresolved-[a-z-]+|unlinked-file|macro-error|inactive-code|unresolved_[a-z_]+)" ../diag/raw.txt | sort | uniq -c | sort -rn | tee ../diag/by-code.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-diag-${{ matrix.target }}
          path: diag
          retention-days: 30

  aggregate:
    permissions:
      contents: read
    name: matrices
    needs: [probe, ast, lsif]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.subject_ref || github.sha }}
          path: subject
      - uses: actions/download-artifact@v4
        with:
          path: collected
      - name: Lay out inputs
        run: |
          mkdir -p agg
          for d in collected/probe-*; do cp -r "$d" "agg/$(basename "$d")"; done
          cp collected/ast/ast.json agg/ast.json
          # optional input: absent when the lsif job could not run
          if [ -f collected/semantic-lsif/actual-use.json ]; then cp collected/semantic-lsif/actual-use.json agg/; fi
          ls agg
      - name: Install numpy, scipy, jsonschema
        run: python3 -m pip install numpy scipy jsonschema
      - name: Build matrices
        working-directory: subject
        run: python3 ../tools/scripts/stratify_aggregate.py ../agg
      # Every serialisation is re-read by an independent parser (jsonschema,
      # csv, numpy.load, scipy.io.mmread) and must equal the canonical JSON.
      # --require-all: a parser that is missing is a failure, not a skip.
      - name: Verify every format round-trips
        run: python3 tools/scripts/stratify_verify.py agg/matrices --require-all
      - name: Publish invariants (machine-readable only)
        if: always()
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat agg/matrices/invariants.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: matrices
          path: agg/matrices
          retention-days: 30
