[package]
name = "larql-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "LARQL command-line interface for artifacts, execution, observation, representation, LQL and serving."

[[bin]]
name = "larql"
path = "src/main.rs"

[dependencies]
larql-router = { path = "../larql-router", default-features = false, optional = true }
larql-core = { path = "../larql-core", default-features = false, features = ["msgpack", "io", "engine"] }
larql-compute = { path = "../larql-compute" }
larql-inference = { path = "../larql-inference" }
larql-kv = { path = "../larql-kv" }
larql-models = { path = "../larql-models" }
larql-lql = { path = "../larql-lql" }
larql-vindex = { path = "../larql-vindex" }
larql-vindex-spec = { path = "../larql-vindex-spec" }
larql-factory = { path = "../larql-factory" }
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.17"
reqwest = { workspace = true, features = ["blocking", "json"], optional = true }
base64 = "0.22"
tokenizers = "0.21"
safetensors = "0.7"
memmap2 = "0.9"
ndarray = "0.16"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
minijinja = "2"
libc = "0.2"
rayon = "1.10"
# Multi-modal Phase 1d: image decode + bicubic resize for the `--image` flag.
# Pruned features — we only need JPEG/PNG/WebP. Skipping TIFF/AVIF/HDR/etc
# avoids dragging in libavif, libtiff, openexr, and a 2 MB binary tax.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Default scratch directory for `larql recipe build` when --scratch-dir
# is omitted — not test-only, the CLI needs this at runtime.
tempfile = "3"

[features]
default = ["research", "net"]
# Research / interpretability tooling: the `larql dev` tree (incl. ov-rd),
# `k3-ledger`, `parity`, `moe-locality`, `optimizer-mcp` and
# `shannon verify`. On for dev builds and CI; tagged release binaries
# (.github/workflows/release.yml) are built without it.
research = []
# Networking: HF download/publish, remote FFN/MoE, VINDEX3 HTTP shard
# transports, server probes. On by default. Tagged release binaries build
# `--no-default-features --features net`. Without it these commands refuse
# loudly, naming the feature. Library crates (larql-inference, -vindex,
# -lql, -factory, -router-protocol) still link reqwest/tonic/tokio until
# they grow their own `net` features; see scripts/net_closure_report.sh.
net = ["dep:reqwest", "dep:larql-router", "larql-core/http"]

[dev-dependencies]
# `test-utils` exposes `larql_models::test_fixtures::make_test_weights`,
# used by run_cmd_image tests to borrow a real ModelConfig without
# enumerating every field by hand. Production builds don't compile it.
larql-models = { path = "../larql-models", features = ["test-utils"] }
# `test-utils` exposes `larql_vindex_spec::test_fixtures::sample_manifest`,
# used by card_cmd tests to build a real VindexManifest without
# enumerating every field by hand.
larql-vindex-spec = { path = "../larql-vindex-spec", features = ["test-utils"] }
larql-vindex = { path = "../larql-vindex", features = ["test-utils"] }

[lints]
workspace = true
