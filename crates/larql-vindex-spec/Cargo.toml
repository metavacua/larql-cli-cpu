[package]
name = "larql-vindex-spec"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Public contract for the vindex on-disk format: Rust types, JSON Schema, validation thresholds. Zero larql-* deps."
keywords = ["vindex", "spec", "schema", "manifest"]
categories = ["data-structures", "encoding"]

# Declared here rather than via `workspace = true`: a workspace dependency
# cannot turn default features off for one member, and `std`/`alloc` are exactly
# what the lower layers have to shed. The versions and the rest of the features
# track the workspace entries (serde `derive`, serde_json `float_roundtrip`,
# thiserror 2).
#
# `serde` is the only dependency of the `core` layer (the derives on the
# `ExtractLevel`/`StorageDtype`/`QuantFormat` enums). `serde_json` and
# `thiserror` serve only alloc-layer items (the manifest map, the error enums)
# and are optional, switched on by `alloc`.
[dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["float_roundtrip"], optional = true }
thiserror = { version = "2", default-features = false, optional = true }

# Three nested layers, the shape `larql-execution` uses: `std` (default) implies
# `alloc`, which sits on `core`.
#   core  (--no-default-features)           enums, constants, thresholds, the
#                                           SlicePreset vocabulary; no heap.
#   alloc (--no-default-features --features alloc)
#                                           + VindexManifest, Source, LayerEntry,
#                                           ShardSlot, SpecError, the
#                                           UnknownSlicePreset parse error and
#                                           the Vec-returning helpers.
#   std   (default)                         the alloc layer on a platform that has
#                                           a standard library. No item of this
#                                           crate needs std, so `std` adds nothing
#                                           beyond `alloc`; it is also what keeps
#                                           the default build identical for every
#                                           existing consumer.
# `std` forwards no dependency `std` feature: none of the items here use one, and
# a feature cannot be made conditional on whether the target ships a standard
# library (wasm32v1-none and the `*-none*` targets do not), so forwarding would
# break `--features std` there.
[features]
default = ["std"]
std = ["alloc"]
alloc = ["dep:serde_json", "dep:thiserror", "serde_json/alloc", "serde/alloc"]
# Minimal `VindexManifest` builders for downstream test suites. Off by
# default so production builds never compile fixture code. Enable from
# a consumer's `[dev-dependencies]` entry, e.g.
# `larql-vindex-spec = { path = "../larql-vindex-spec", features = ["test-utils"] }`.
test-utils = ["alloc"]

[lints]
workspace = true
