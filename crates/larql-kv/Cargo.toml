[package]
name = "larql-kv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Pluggable KV-cache engines for larql-inference (markov-rs, unlimited-context, turbo-quant, apollo)"

[dependencies]
larql-inference = { path = "../larql-inference" }
larql-execution = { path = "../larql-execution" }
larql-compute = { path = "../larql-compute" }
larql-vindex = { path = "../larql-vindex" }
larql-boundary = { path = "../larql-boundary" }

serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }

ndarray = "0.16"
zip = { version = "2", default-features = false }

# BLAS: `ndarray`'s `blas` feature is enabled per platform; the native link
# (Accelerate / system OpenBLAS) is forced by `larql-compute`, which this
# crate depends on. Windows has no BLAS backend (see `larql-compute/Cargo.toml`).
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "macos"))'.dependencies]
ndarray = { version = "0.16", features = ["blas"] }

[dev-dependencies]
# CONTINUATION-MEM-1's harness reads KvView::backing_addresses (test-utils only).
larql-vindex = { path = "../larql-vindex", features = ["test-utils"] }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
# Test-only: Lloyd-Max codebook regeneration pins (turbo_quant/codebooks.rs).
rand = "0.8"
rand_distr = "0.4"

[[bench]]
name = "engine_decode"
harness = false


[lints]
workspace = true
