[package]
name = "larql-execution"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Execution-refusal semantics shared across LARQL's runtime crates. Zero larql-* deps."
keywords = ["execution", "refusal", "runtime"]
categories = ["data-structures"]

# Deliberately empty, and it should stay that way. This is a contract crate:
# `larql-compute` sits below `larql-vindex` in the graph, so neither could name
# the other's refusal vocabulary without a cycle, and a shared leaf is the only
# place the classification can live. Follows `larql-vindex-spec`'s precedent —
# a dependency-light contract several crates depend on.
[dependencies]

# Three nested layers: `std` (OS services) implies `alloc` (heap), which sits on
# `core`. `std` is on by default so every current consumer builds exactly as
# before; --no-default-features is `core` only, --features alloc adds the heap.
[features]
default = ["std"]
std = ["alloc"]
alloc = []

[lints]
workspace = true
